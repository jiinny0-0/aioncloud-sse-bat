# environments.yaml로 복사해서 값을 채웁니다.
#
# 스테이지마다 블록 하나: URL, 워크스페이스, 단말. 자격증명은 .env에 둡니다.
# 스테이지는 BAT_PROFILE=<이름> 또는 `bat run --profile <이름>`으로 고릅니다.
environments:
  stage-example:
    # --- 이 스테이지의 콘솔/API 주소 ---
    console_url: "https://example.aioncloud.com:50443"
    graphql_url: "https://example.aioncloud.com:2443/graphql"
    rest_base_url: "https://example.aioncloud.com:3443"
    block_page_marker: "Your request / response has"   # 차단 페이지를 알아보는 문구
    verify_tls: false
    # 단말의 커넥터 프로세스 이름. 생략하면 "AIConnector for Client". LG U+ 망은 "U+SASE".
    connector_process: "AIConnector for Client"

    # 이 스테이지의 자격증명 파일. 생략하면 .env.<스테이지 이름>을 쓰고,
    # 거기 없는 값은 공용 .env에서 읽습니다.
    env_file: .env.stage-example

    # --- 레인마다 쓸 워크스페이스 ---
    # api 레인은 단말이 필요 없고, 나머지 레인은 단말 한 대에 고정됩니다
    # (단말 한 대에 커넥터 하나).
    workspaces:
      - name: tenant1
        lane: api
      - name: tenant2
        lane: b
      - name: tenant3
        lane: c
      - name: tenant4
        lane: d
      - name: tenant5
        lane: e

    # --- 단말이 있는 레인마다 단말 하나 ---
    # transport: winrm  -> 러너가 원격으로 단말을 조작 (pywinrm 필요)
    # transport: local  -> 러너가 그 단말에서 직접 실행 중
    endpoints:
      - name: ec2-win
        lane: b
        transport: winrm
        host: "10.0.0.11"
        os: windows
        device_id: ""   # 콘솔에서 확인되면 채움. 인증 로그를 이 단말로 귀속할 때 씀

      - name: qa-desktop
        lane: c
        transport: winrm
        host: "10.0.0.12"
        os: windows
        device_id: ""
