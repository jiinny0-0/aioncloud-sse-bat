# environments.yaml로 복사해서 값을 채웁니다.
#
# 스테이지마다 블록 하나: URL, 워크스페이스, 단말. 자격증명은 .env에 둡니다.
# 스테이지는 BAT_PROFILE=<이름> 또는 `bat run --profile <이름>`으로 고릅니다.
environments:
  stage-example:
    # --- 이 스테이지의 콘솔/API 주소 ---
    console_url: "https://example.aioncloud.com:50443"
    graphql_url: "https://example.aioncloud.com:2443/graphql"
    rest_base_url: "https://example.aioncloud.com:3443"
    block_page_marker: "Your request / response has"   # 차단 페이지를 알아보는 문구
    verify_tls: false
    # 단말의 커넥터 프로세스 이름. 생략하면 "AIConnector for Client". LG U+ 망은 "U+SASE".
    connector_process: "AIConnector for Client"

    # 이 스테이지의 자격증명 파일. 생략하면 .env.<스테이지 이름>을 쓰고,
    # 거기 없는 값은 공용 .env에서 읽습니다.
    env_file: .env.stage-example

    # ZTNA 게이트웨이 케이스(BAT-ZTNA-009~013)의 대상. 생략해도 된다: 게이트웨이 서버 목록에서
    # 흔한 웹 포트 중 규칙 없이 처음 열리는 서버와 포트, 그 페이지 <title>, 콘솔이 그 서버에 붙인
    # 도메인, 같은 포트로 열리는 다른 서버를 찾아서 쓴다. 특정 서버·포트·문구를 쓰고 싶을 때만
    # 적는다(적은 값만 우선). server_ip는 게이트웨이 서버 목록에 있어야 하고, domain은 단말에서
    # 그 IP로 풀리는 이름, other_ip는 같은 포트로 열리는 다른 내부 서버(규칙 범위 확인용).
    # ztna:
    #   server_ip: 192.168.3.106
    #   domain: web.internal.example
    #   port: 80
    #   page_text: "내부 서버 페이지에 있는 문구"
    #   other_ip: 192.168.3.227

    # 실제 터널 케이스(BAT-ZTNA-015/016)의 대상. 생략해도 된다: 연결된(초록불) 터널을 고르고,
    # 그 interface의 흔한 웹 포트 중 처음 열리는 곳과 그 페이지 <title>을 쓴다. 터널이
    # 여럿이거나 특정 포트·문구를 쓰고 싶을 때만 적는다. 서버 IP와 도메인은 터널 목록에서 읽는다.
    # ztna_tunnel:
    #   name: bat-tunnel
    #   port: 8080
    #   page_text: "터널 뒤 서버 페이지에 있는 문구"

    # --- 레인마다 쓸 워크스페이스 ---
    # api 레인은 단말이 필요 없고, 나머지 레인은 단말 한 대에 고정됩니다
    # (단말 한 대에 커넥터 하나).
    workspaces:
      - name: tenant1
        lane: api
      - name: tenant2
        lane: b
      - name: tenant3
        lane: c
      - name: tenant4
        lane: d
      - name: tenant5
        lane: e

    # --- 단말이 있는 레인마다 단말 하나 ---
    # transport: winrm  -> 러너가 원격으로 단말을 조작 (pywinrm 필요)
    # transport: local  -> 러너가 그 단말에서 직접 실행 중
    endpoints:
      - name: ec2-win
        lane: b
        transport: winrm
        host: "10.0.0.11"
        os: windows
        device_id: ""   # 콘솔에서 확인되면 채움. 인증 로그를 이 단말로 귀속할 때 씀

      - name: qa-desktop
        lane: c
        transport: winrm
        host: "10.0.0.12"
        os: windows
        device_id: ""
