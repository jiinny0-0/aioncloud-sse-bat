[project]
name = "aioncloud-sse-bat"
version = "0.1.0"
description = "AIONCLOUD SSE Business Acceptance Test automation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.47",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
winrm = ["pywinrm>=0.4.3"]

[project.scripts]
bat = "bat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 설치 대상은 bat 패키지뿐이다 (config/, tests/는 같은 위치에 있지만 설치하지 않음).
[tool.setuptools.packages.find]
include = ["bat*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "product(name): SSE product under test (basic, swg, dlp, fwaas, rbi, casb, genai, ztna, cross)",
    "case(id): BAT case id, e.g. BAT-SWG-001",
    "priority(level): P0..P4",
    "lane(name): resource lane (api, b, c, d, e)",
    "smoke: representative case per product",
    "critical: key cases (informational; the rollback set is `gate`)",
    "gate: deployment rollback set — only these can end FAIL; any other case's failure is at most WARN. Gate cases are P0 and only gate cases are P0",
    "run_start: runs before every other case in its own phase (server check, baseline); excluded from the main run",
    "run_end: runs after every other case and its cleanup (baseline); excluded from the main run",
    "manual: requires a human action, excluded from the default run",
    "parked: held back (RBI) — excluded from the default run and the status book; run with --tag parked",
    "crud: only creates/reads/deletes through the API (no traffic, no events) — API-suite territory, excluded from the default run",
    "verifies(*steps): mandatory criteria (user_visible_result, event_validation) — PASS needs a passing assertion on each",
    "known_issue(reason, match=regex): a symptom the user does not treat as a bug — a FAIL whose reason matches `match` is reported as SKIP; other failures stay FAIL",
    "diagnostic: environment check; PASS when every recorded check passed, FAIL when one failed, UNVERIFIED with none",
    "discovery: requires runtime policy-schema discovery",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
log_cli_date_format = "%H:%M:%S"
