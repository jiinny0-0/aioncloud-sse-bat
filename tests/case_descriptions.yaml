BAT-CASB-003:
  test_steps: |-
    1. Notion으로 좁힌 SaaS Access LOGGING 정책 생성
    2. 브라우저로 Notion과 GitHub를 방문해 둘 다 렌더링되는지 확인
    3. 이 정책의 Notion 행 확인
    4. 표지로 Notion을 한 번 더 방문해 그 새 행이 나타난 뒤, 이 정책의 행 중 Notion 외 앱이 없는지 확인(표지 행이 안 보이면 UNVERIFIED)
    5. 정책 삭제
  test_parameters: |-
    product: casb
    lane: d
    policy_type: saas_access
    action_type: LOGGING
    risk_level: Minor
    application: [3] (Notion만 스코프)
    event_timeout_sec: run_context.event_poll_timeout_sec
  test_data: CASB_SAAS_APP_ID=3(Notion), CASB_SAAS_APP_NAME="Notion", CASB_SAAS_URL="https://www.notion.so/", CASB_OTHER_APP_URL="https://github.com/"(bat/fixtures/testdata.py). 정책명은 resource_name()으로 동적 생성.
  expected_results: 지정한 앱만 기록되고, 다른 앱(GitHub)은 렌더링되며 이 정책으로 기록되지 않는다.
  en:
    scenario: CASB SaaS Access detects only the specified SaaS app and does not touch other apps.
    test_steps: |-
      1. Create a SaaS Access LOGGING policy narrowed to Notion
      2. Visit Notion and GitHub with the browser and check that both render
      3. Check this policy's Notion row
      4. Visit Notion once more as a marker; after that new row appears, check that none of this policy's rows is for an app other than Notion (UNVERIFIED if the marker row does not appear)
      5. Delete the policy
    test_parameters: |-
      product: casb
      lane: d
      policy_type: saas_access
      action_type: LOGGING
      risk_level: Minor
      application: [3] (scoped to Notion only)
      event_timeout_sec: run_context.event_poll_timeout_sec
    test_data: CASB_SAAS_APP_ID=3 (Notion), CASB_SAAS_APP_NAME="Notion", CASB_SAAS_URL="https://www.notion.so/", CASB_OTHER_APP_URL="https://github.com/" (bat/fixtures/testdata.py). The policy name is generated dynamically with resource_name().
    expected_results: Only the specified app is logged; the other app (GitHub) renders and is not logged by this policy.
BAT-CASB-004:
  test_steps: |-
    1. resource_name()으로 BAT-CASB-004-<run_id> 정책명을 만든다.
    2. saas_access.temporary()로 application=[CASB_SAAS_APP_ID](Notion), action_type=BLOCK, risk_level=Major인 정책을 생성한다.
    3. visit_until_blocked()으로 CASB_SAAS_URL(Notion)을 브라우저로 반복 방문하며 차단 페이지가 뜨는지 run_context.policy_propagation_timeout_sec 동안 재시도한다(결과는 기록만 하고 통과/실패 판정에는 쓰지 않음).
    4. await_casb_event()로 casb_security_log에서 이 정책명에 대한 이벤트(기대 서비스명 Notion)를 폴링 대기한다.
    5. 이벤트의 action 필드가 BLOCK인지 확인하고 어서션한다.
    6. 통과 후 temporary() 종료로 정책을 삭제한다.
  test_parameters: |-
    product: casb
    lane: d
    policy_type: saas_access
    action_type: BLOCK
    risk_level: Major
    application: [3] (Notion)
    propagation_timeout_sec: run_context.policy_propagation_timeout_sec
    event_timeout_sec: run_context.event_poll_timeout_sec
  test_data: CASB_SAAS_APP_ID=3(Notion), CASB_SAAS_URL="https://www.notion.so/". 정책명은 resource_name()으로 동적 생성.
  expected_results: BLOCK 정책이 걸린 상태에서 Notion 방문 트래픽에 대해 casb_security_log 이벤트의 action이 반드시 BLOCK으로 기록되어야 한다(화면상 차단 여부는 판정 기준이 아님).
  en:
    scenario: When CASB SaaS Access is set to BLOCK, access to that app is actually blocked, and that request is logged as BLOCK.
    test_steps: |-
      1. Build the policy name BAT-CASB-004-<run_id> with resource_name().
      2. Create a policy with application=[CASB_SAAS_APP_ID] (Notion), action_type=BLOCK, risk_level=Major via saas_access.temporary().
      3. With visit_until_blocked(), repeatedly visit CASB_SAAS_URL (Notion) with the browser and retry for run_context.policy_propagation_timeout_sec until the block page appears (the result is only recorded and is not used for the pass/fail verdict).
      4. With await_casb_event(), poll casb_security_log for an event for this policy name (expected service name Notion).
      5. Check and assert that the event's action field is BLOCK.
      6. After passing, delete the policy when temporary() exits.
    test_parameters: |-
      product: casb
      lane: d
      policy_type: saas_access
      action_type: BLOCK
      risk_level: Major
      application: [3] (Notion)
      propagation_timeout_sec: run_context.policy_propagation_timeout_sec
      event_timeout_sec: run_context.event_poll_timeout_sec
    test_data: CASB_SAAS_APP_ID=3 (Notion), CASB_SAAS_URL="https://www.notion.so/". The policy name is generated dynamically with resource_name().
    expected_results: With the BLOCK policy in place, the action of the casb_security_log event for the Notion visit traffic must be recorded as BLOCK (whether the screen is blocked is not a verdict criterion).
BAT-CASB-005:
  test_steps: |-
    1. SIA.casb.in_app_control 목록 조회
    2. 조회가 답하면 통과(환경 점검, diagnostic). 조회 실패는 BAT_ERROR
