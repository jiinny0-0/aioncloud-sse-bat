    2. 조회가 답하면 통과(환경 점검, diagnostic). 빈 목록도 통과
  test_parameters: |-
    조회 필드: tunnel.list{id,name,description}, gateway.list{id,name,description}
    검증 대상: 두 결과가 모두 list 타입인지 여부
  test_data: 별도 입력 데이터 없음(조회 전용 쿼리), 이 테넌트에서 실측된 응답은 tunnel.list=[], gateway.list=[] (둘 다 빈 배열)
  expected_results: 보호 대상 리소스 목록 조회가 오류 없이 응답한다(환경 점검).
  en:
    scenario: The list of ZTNA protected resources (tunnel/gateway) can be queried (environment check).
    test_steps: |-
      1. Query the SIA.ztna tunnel/gateway lists
      2. Pass if the query answers (environment check, diagnostic). An empty list also passes
    test_parameters: |-
      query fields: tunnel.list{id,name,description}, gateway.list{id,name,description}
      verification target: whether both results are of list type
    test_data: No separate input data (query only); the responses measured in this tenant are tunnel.list=[], gateway.list=[] (both empty arrays)
    expected_results: The protected resource list query responds without error (environment check).
BAT-ZTNA-005:
  test_steps: |-
    1. 인증 로그에서 디렉터리 실사용자 id를 찾음
    2. 그 사용자 id와 country AQ rule로 BLOCK 접근 정책 생성, 다시 읽어 동작·사용자 id·국가 비교
    3. 정책 삭제(목록에서 사라졌는지 확인)
    4. 커넥터가 여전히 실행 중이고, ALLOW_TARGET 호스트에 건 LOGGING 웹 정책으로 이 단말의 마커 요청이 보안 로그에 찍히는지 확인(트래픽이 여전히 SSE를 지남)
    5. LOGGING 정책 삭제
  test_parameters: |-
    Rule: user_ids=[실사용자 id], countries=[AQ]
    비교 대상: connector service state(Running), auth_log 이벤트 수(사전/사후)
  test_data: 인증 로그에서 동적으로 얻은 실사용자 id (고정값 아님)
  expected_results: 실사용자 id로 만든 정책이 요청한 값으로 저장되고, 지운 뒤에도 이 단말의 트래픽이 SSE를 정상 경유한다.
  en:
    scenario: After finding a real user in the auth log, applying a policy and deleting it, the connector session is still intact.
    test_steps: |-
      1. Find a real directory user id in the auth log
      2. Create a BLOCK access policy with that user id and a country AQ rule, re-read it, and compare action, user id and country
      3. Delete the policy (confirm it disappeared from the list)
      4. Confirm the connector is still running, and that a marker request from this endpoint appears in the security log through a LOGGING web policy placed on the ALLOW_TARGET host (traffic still passes through SSE)
      5. Delete the LOGGING policy
    test_parameters: |-
      Rule: user_ids=[real user id], countries=[AQ]
      comparison targets: connector service state (Running), number of auth_log events (before/after)
    test_data: Real user id obtained dynamically from the auth log (not a fixed value)
    expected_results: The policy made with the real user id is stored with the requested values, and even after it is deleted this endpoint's traffic still passes through SSE normally.
