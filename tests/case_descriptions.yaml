    게이트웨이 서버: SIA.ztna.gateway.list.servers {id, ip, domain}
    접근제어: type HTTP, application [{domain, port, target_type: gateway, target_id}], priority 0
    접근정책: action LOGGING, rules [{user_id: [0]}]
