  test_data: EICAR_STRING (업계 표준 68바이트 EICAR 테스트 문자열 — 실제 악성코드 아님)
  expected_results: EICAR 업로드가 ANTI_VIRUS 시그니처에 의해 차단된다(차단 없이 내용 그대로 전달되면 FAIL)
  actual_result: EICAR 파일이 내용 그대로 전달됐지만 ANTI_VIRUS가 차단하지 않음
BAT-SWG-017:
  test_steps: |-
    1. www.example.org를 C&C deny 목록에 추가
    2. 모듈 LOGGING 사본으로 목록 밖 매칭이 없는지 확인
    3. BLOCK_CNC_TRAFFIC BLOCK 정책 생성
    4. 마커를 단 www.example.org 요청이 차단되고 그 요청 자신의 정책 행이 남는지 확인
