BAT-DLP-001:
  test_steps: |-
    1. DLP 키워드 룰 정책과 그것을 연결한 BLOCK 웹 정책 생성
    2. 대상 호스트(ECHO_HOSTS)마다 마커를 단 /post로 키워드 데이터를 POST해 차단될 때까지 반복
    3. 그 요청 자신의 DLP 정책 행(마커)과 식별 정보 확인
    4. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    5. 정책 삭제
  test_parameters: |-
    DLP rule type: keyword
    Target: https://<호스트>/post (httpbin.org, postman-echo.com, httpbingo.org)
    Marker: case_id+run_id 조합의 고유 토큰
  test_data: |-
    DLP keyword rule: ["bat-token", [token]]
    POST body: token을 포함한 payload
  expected_results: 키워드가 든 업로드가 호스트마다 차단되고 그 요청의 행이 남는다.
  en:
    scenario: Sending data that matches a DLP keyword rule is blocked and an event is logged.
    test_steps: |-
      1. Create a DLP keyword rule policy and a BLOCK web policy linked to it
      2. For each target host (ECHO_HOSTS), POST keyword data to a marked /post, repeating until it is blocked
      3. Check the DLP policy row of that request itself (marker) and the identity information
      4. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      5. Delete the policy
    test_parameters: |-
      DLP rule type: keyword
      Target: https://<host>/post (httpbin.org, postman-echo.com, httpbingo.org)
      Marker: unique token combining case_id and run_id
    test_data: |-
      DLP keyword rule: ["bat-token", [token]]
      POST body: payload containing the token
    expected_results: The upload containing the keyword is blocked on every host and a row for that request is logged.
BAT-DLP-002:
  test_steps: |-
    1. 내장 탐지 룰 중 카드번호(Visa 우선) 룰로 DLP 정책과 연결 BLOCK 웹 정책 생성
    2. 대상 호스트마다 마커를 단 /post로 테스트 카드번호를 POST해 차단될 때까지 반복
    3. 그 요청 자신의 DLP 정책 행(마커) 확인
    4. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    5. 정책 삭제
  test_parameters: |-
    DLP rule type: PREDEFINED
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    전송 방식: POST (curl)
  test_data: |-
    predefined 룰 code: predefined_rules() 조회 결과 중 코드/표시명에 'visa' 또는 'card'를 포함하는 항목(런타임에 결정, 하드코딩 아님)
    전송 페이로드: card=4111-1111-1111-1111 (SYNTHETIC_CARD, Luhn 유효하나 테스트 전용으로 영구 예약된 번호)
    대상 URL: https://<호스트>/post, 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 정책은 하나이고 호스트마다 전송·차단·이벤트(그 호스트의 이벤트)를 확인한다. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    정책/DLP 이름: resource_name(case.case_id, run_id)로 런마다 동적 생성
  expected_results: 테스트 카드번호 업로드가 호스트마다 차단되고 그 요청의 행이 남는다.
  en:
    scenario: The built-in detection rule (card number) works in actual transmission.
    test_steps: |-
      1. Create a DLP policy and a linked BLOCK web policy using the card number rule (Visa preferred) among the built-in detection rules
      2. For each target host, POST the test card number to a marked /post, repeating until it is blocked
      3. Check the DLP policy row of that request itself (marker)
      4. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      5. Delete the policy
    test_parameters: |-
      DLP rule type: PREDEFINED
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Transmission method: POST (curl)
    test_data: |-
      predefined rule code: the item among the predefined_rules() query results whose code/display name contains 'visa' or 'card' (decided at runtime, not hardcoded)
      Payload: card=4111-1111-1111-1111 (SYNTHETIC_CARD, Luhn-valid but a number permanently reserved for testing)
      Target URL: https://<host>/post, target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. There is one policy, and transmission, block and event (that host's event) are checked per host. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      Policy/DLP name: generated dynamically per run with resource_name(case.case_id, run_id)
    expected_results: The test card number upload is blocked on every host and a row for that request is logged.
BAT-DLP-003:
  test_steps: |-
    1. DLP 정규식 룰 정책과 연결 BLOCK 웹 정책 생성
    2. 대상 호스트마다 마커를 단 /post로 정규식에 맞는 데이터를 POST해 차단될 때까지 반복
    3. 그 요청 자신의 DLP 정책 행(마커) 확인
    4. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    5. 정책 삭제
  test_parameters: |-
    DLP rule type: REGEX
    DLP rule name: bat-code
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    전송 방식: POST (curl)
  test_data: |-
    정규식 패턴: CUSTOM_REGEX = r"BATCODE-[0-9]{4}-[A-Z]{3}"
    전송 페이로드: regex_sample() 결과 — 예: code=BATCODE-1234-ZZZ 형태(숫자부는 uuid4 기반으로 매 실행마다 동적 생성, 접미사는 항상 ZZZ)
    대상 URL: https://<호스트>/post, 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 정책은 하나이고 호스트마다 전송·차단·이벤트(그 호스트의 이벤트)를 확인한다. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    정책/DLP 이름: resource_name(case.case_id, run_id)로 런마다 동적 생성
  expected_results: 정규식에 맞는 업로드가 호스트마다 차단되고 그 요청의 행이 남는다.
  en:
    scenario: Data matching a DLP regex rule is blocked.
    test_steps: |-
      1. Create a DLP regex rule policy and a linked BLOCK web policy
      2. For each target host, POST regex-matching data to a marked /post, repeating until it is blocked
      3. Check the DLP policy row of that request itself (marker)
      4. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      5. Delete the policy
    test_parameters: |-
      DLP rule type: REGEX
      DLP rule name: bat-code
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Transmission method: POST (curl)
    test_data: |-
      Regex pattern: CUSTOM_REGEX = r"BATCODE-[0-9]{4}-[A-Z]{3}"
      Payload: result of regex_sample(), e.g. code=BATCODE-1234-ZZZ (the digits are generated dynamically each run from uuid4, the suffix is always ZZZ)
      Target URL: https://<host>/post, target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. There is one policy, and transmission, block and event (that host's event) are checked per host. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      Policy/DLP name: generated dynamically per run with resource_name(case.case_id, run_id)
    expected_results: The upload matching the regex is blocked on every host and a row for that request is logged.
BAT-DLP-004:
  test_steps: |-
    1. 키워드가 든 합성 파일(BAT-DLP-004-<run_id>.txt)을 단말에 씀
    2. DLP 키워드 룰 정책과 연결 BLOCK 웹 정책 생성
    3. 대상 호스트마다 마커를 단 /post로 파일을 업로드해 차단될 때까지 반복
    4. 그 업로드 요청 자신의 행(마커)을 찾고, 행의 file_name이 업로드한 파일 이름과 같은지 비교(다르면 FAIL, 없으면 UNVERIFIED)
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    6. 정책과 파일 삭제
  test_parameters: |-
    DLP rule type: KEYWORD
    DLP rule name: bat-token
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    전송 방식: 파일 업로드 (multipart, https://<호스트>/post (httpbin.org, postman-echo.com, httpbingo.org))
  test_data: |-
    키워드: marker(case_id, run_id) 결과 — 'BATSENSITIVE' + case_id(하이픈 제거) + run_id 앞 12자(런마다 동적 생성)
    업로드 파일 본문: upload_file_body(token) — "BAT synthetic document\nThis file exists only to exercise DLP upload detection.\nmarker: <token>\n"
    업로드 파일명: {case.case_id}-{run_context.run_id}.txt
    대상 URL: https://<호스트>/post, 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 정책은 하나이고 호스트마다 전송·차단·이벤트(그 호스트의 이벤트)를 확인한다. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  expected_results: 키워드가 든 파일 업로드가 차단되고, 그 요청의 행이 업로드한 파일 이름을 기록한다.
  en:
    scenario: Uploading a file containing a sensitive string is blocked.
    test_steps: |-
      1. Write a synthetic file containing the keyword (BAT-DLP-004-<run_id>.txt) on the endpoint
      2. Create a DLP keyword rule policy and a linked BLOCK web policy
      3. For each target host, upload the file to a marked /post, repeating until it is blocked
      4. Find the row of that upload request itself (marker) and compare the row's file_name with the uploaded file name (FAIL if different, UNVERIFIED if missing)
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      6. Delete the policy and the file
    test_parameters: |-
      DLP rule type: KEYWORD
      DLP rule name: bat-token
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Transmission method: file upload (multipart, https://<host>/post (httpbin.org, postman-echo.com, httpbingo.org))
    test_data: |-
      Keyword: result of marker(case_id, run_id) — 'BATSENSITIVE' + case_id (hyphens removed) + first 12 characters of run_id (generated dynamically per run)
      Upload file body: upload_file_body(token) — "BAT synthetic document\nThis file exists only to exercise DLP upload detection.\nmarker: <token>\n"
      Upload file name: {case.case_id}-{run_context.run_id}.txt
      Target URL: https://<host>/post, target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. There is one policy, and transmission, block and event (that host's event) are checked per host. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    expected_results: The upload of the file containing the keyword is blocked, and the row for that request records the uploaded file name.
BAT-DLP-005:
  test_steps: |-
    1. 키워드 룰(이름 'bat-token', 키워드는 런별 마커 토큰)을 가진 DLP 정책을 생성한다.
    2. 이 DLP 정책을 참조하는 DLP_POLICY rule을 가진 웹 정책을 BLOCK/MAJOR로 생성한다.
    3. 양성 대조: 키워드 페이로드를 마커를 단 https://httpbin.org/post로 보내 차단되고, 그 요청(마커) 자신의 이벤트가 이 정책 id로 남는지 확인한다.
    4. 키워드가 없는 깨끗한 페이로드를 대상 호스트 세 곳(httpbin.org, postman-echo.com, httpbingo.org)의 /post로 각자 마커를 달아 3회씩 보내 매번 정상 전달되는지 확인한다(한 번이라도 차단되면 FAIL).
    5. 표지 요청: 키워드 페이로드를 마커를 단 httpbin.org/post로 한 번 더 보내 그 행이 로그에 나타날 때까지 기다린다(안 나타나면 UNVERIFIED).
    6. 그 다음 깨끗한 요청들의 마커가 든 행이 이 정책으로 하나도 없는지 확인한다(부재 검증).
    7. with 블록 종료 시 웹 정책과 DLP 정책을 자동 삭제한다.
    8. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    DLP rule type: KEYWORD
    DLP rule name: bat-token
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    전송 방식: POST (post_payload, 단발성)
  test_data: |-
    키워드(미사용 대조값): marker(case_id, run_id) 결과(런마다 동적 생성)
    전송 페이로드: clean_payload() = "note=quarterly review&owner=bat-suite&secret=nothing-to-see-here" (키워드 미포함)
    대상 URL: https://<호스트>/post, 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 정책은 하나이고 호스트마다 전송·차단·이벤트(그 호스트의 이벤트)를 확인한다. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  expected_results: 정책이 키워드 데이터를 실제로 막는 상태에서, 키워드가 없는 정상 페이로드는 매번 차단되지 않고 전달되어야 하며 그 요청들에 대해 이 웹 정책의 보안 이벤트가 남지 않아야 한다(오탐 없음).
  en:
    scenario: Data that does not match the detection condition is transmitted normally and no event is logged.
    test_steps: |-
      1. Create a DLP policy with a keyword rule (name 'bat-token', keyword is the per-run marker token).
      2. Create a web policy with BLOCK/MAJOR that has a DLP_POLICY rule referencing this DLP policy.
      3. Positive control: send the keyword payload to the marked https://httpbin.org/post and check that it is blocked and that the event of that request itself (marker) is logged with this policy id.
      4. Send a clean payload without the keyword to /post of the three target hosts (httpbin.org, postman-echo.com, httpbingo.org), each with its own marker, 3 times each, and check that it is delivered normally every time (FAIL if blocked even once).
      5. Marker request: send the keyword payload once more to the marked httpbin.org/post and wait until that row appears in the log (UNVERIFIED if it does not appear).
      6. Then check that none of the rows containing the markers of the clean requests belongs to this policy (absence check).
      7. The web policy and DLP policy are deleted automatically when the with block ends.
      8. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: |-
      DLP rule type: KEYWORD
      DLP rule name: bat-token
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Transmission method: POST (post_payload, one-shot)
    test_data: |-
      Keyword (unused control value): result of marker(case_id, run_id) (generated dynamically per run)
      Payload: clean_payload() = "note=quarterly review&owner=bat-suite&secret=nothing-to-see-here" (does not contain the keyword)
      Target URL: https://<host>/post, target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. There is one policy, and transmission, block and event (that host's event) are checked per host. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    expected_results: While the policy is actually blocking keyword data, a normal payload without the keyword must be delivered without being blocked every time, and no security event of this web policy must be logged for those requests (no false positives).
BAT-DLP-006:
  test_steps: |-
    1. DLP 키워드 룰 정책과 연결 BLOCK 웹 정책 생성
    2. 대상 호스트마다 마커를 단 키워드 POST가 차단되고 그 요청 자신의 정책 행이 남는지 확인
    3. 웹 정책 비활성화 후 다시 읽어 enable=false로 저장됐는지 확인
    4. 호스트마다 전파 예산 안에 통과가 시작되고, 예산이 지난 뒤 3번 연속 통과하는지 확인
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    6. 정책 삭제
  test_parameters: |-
    DLP rule type: KEYWORD
    DLP rule name: bat-token
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    정책 상태 전환: enable=True → enable=False (PATCH /sia/v1/web/policy/{id}/enable)
  test_data: |-
    키워드: marker(case_id, run_id) 결과(런마다 동적 생성)
    전송 페이로드: keyword_payload(token) = "note=quarterly review&secret=<token>&owner=bat-suite" (활성화/비활성화 양쪽에 동일 페이로드 재사용)
    대상 URL: https://<호스트>/post, 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 정책은 하나이고 호스트마다 전송·차단·이벤트(그 호스트의 이벤트)를 확인한다. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  expected_results: 정책이 막던 데이터가 비활성화(재조회로 확인) 후 다시 통과하고 그대로 유지된다.
  en:
    scenario: When the policy is disabled, the same data is transmitted normally again.
    test_steps: |-
      1. Create a DLP keyword rule policy and a linked BLOCK web policy
      2. For each target host, check that a marked keyword POST is blocked and a policy row for that request itself is logged
      3. Disable the web policy and re-read it to check that it is stored as enable=false
      4. For each host, check that requests start passing within the propagation budget and pass 3 times in a row after the budget has elapsed
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      6. Delete the policy
    test_parameters: |-
      DLP rule type: KEYWORD
      DLP rule name: bat-token
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Policy state change: enable=True → enable=False (PATCH /sia/v1/web/policy/{id}/enable)
    test_data: |-
      Keyword: result of marker(case_id, run_id) (generated dynamically per run)
      Payload: keyword_payload(token) = "note=quarterly review&secret=<token>&owner=bat-suite" (the same payload is reused for both enabled and disabled)
      Target URL: https://<host>/post, target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. There is one policy, and transmission, block and event (that host's event) are checked per host. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    expected_results: The data the policy was blocking passes again after the policy is disabled (confirmed by re-reading) and stays that way.
BAT-DLP-007:
  test_steps: |-
    1. DLP 키워드 룰 정책과 연결 BLOCK 웹 정책 생성
    2. 마커를 단 키워드 POST가 차단되고 그 요청 자신의 행을 찾음
    3. 행의 상세 필드와 이벤트 상세 조회 결과를 근거로 기록
    4. 행의 device_id가 이 단말 id(설정값 또는 하드웨어 UUID), user_name이 같은 단말 인증 로그의 user_name, policy_name/action이 이 정책·BLOCK인지 값으로 비교(다르거나 비어 있으면 FAIL)
    5. 정책 삭제
  test_parameters: |-
    DLP rule type: KEYWORD
    DLP rule name: bat-token
    웹 정책 action_type: BLOCK
    웹 정책 risk_level: MAJOR
    웹 정책 rule subject: DLP_POLICY, condition: IS
    검증 대상 이벤트 필드: user_name, policy_name, action (필수), file_name 등은 details_of로 추가 기록
  test_data: |-
    키워드: marker(case_id, run_id) 결과(런마다 동적 생성)
    전송 페이로드: keyword_payload(token) = "note=quarterly review&secret=<token>&owner=bat-suite"
    대상 URL: https://httpbin.org/post (POST_TARGET_URL)
  expected_results: DLP 이벤트에 그 요청의 대상, 이 단말, 실제 사용자, 정책, 행위가 맞는 값으로 기록된다.
  en:
    scenario: The user, endpoint, policy, action and target are all recorded in the DLP event.
    test_steps: |-
      1. Create a DLP keyword rule policy and a linked BLOCK web policy
      2. A marked keyword POST is blocked, and find the row of that request itself
      3. Record the row's detail fields and the event detail query result as evidence
      4. Compare by value that the row's device_id is this endpoint's id (configured value or hardware UUID), user_name is the user_name in the same endpoint's auth log, and policy_name/action are this policy and BLOCK (FAIL if different or empty)
      5. Delete the policy
    test_parameters: |-
      DLP rule type: KEYWORD
      DLP rule name: bat-token
      Web policy action_type: BLOCK
      Web policy risk_level: MAJOR
      Web policy rule subject: DLP_POLICY, condition: IS
      Event fields verified: user_name, policy_name, action (required); file_name etc. are additionally recorded via details_of
    test_data: |-
      Keyword: result of marker(case_id, run_id) (generated dynamically per run)
      Payload: keyword_payload(token) = "note=quarterly review&secret=<token>&owner=bat-suite"
      Target URL: https://httpbin.org/post (POST_TARGET_URL)
    expected_results: The DLP event records the target of that request, this endpoint, the actual user, the policy and the action with correct values.
BAT-DLP-008:
  test_steps: |-
    1. 키워드 룰과 정규식 룰을 함께 담은 DLP 정책 하나와 연결 BLOCK 웹 정책 생성
    2. 마커 keyword를 단 키워드 전용 POST가 차단되고 그 요청 자신의 행이 남는지 확인
    3. 마커 regex를 단 정규식 전용 POST가 차단되고 그 요청 자신의 행이 남는지 확인
    4. 정책 삭제
  test_parameters: 'DLP rules: keyword("bat-token", token) + regex("bat-regex", CUSTOM_REGEX), 한 정책에 동시 등록'
  test_data: |-
    키워드 payload: token 포함 문자열
    정규식 payload: CUSTOM_REGEX에 매칭되는 샘플 문자열
  expected_results: 한 정책의 두 룰이 각자 자기 데이터를 막고, 요청마다 행이 남는다.
  actual_result: 키워드 payload는 차단됐지만, 정규식만 일치하는 payload는 차단되지 않음(HTTP 200)
  en:
    scenario: When multiple rules are put in one DLP policy, a match on any one of them is blocked.
    test_steps: |-
      1. Create one DLP policy containing both a keyword rule and a regex rule, and a linked BLOCK web policy
      2. Check that a keyword-only POST with the marker keyword is blocked and a row for that request itself is logged
      3. Check that a regex-only POST with the marker regex is blocked and a row for that request itself is logged
      4. Delete the policy
    test_parameters: 'DLP rules: keyword("bat-token", token) + regex("bat-regex", CUSTOM_REGEX), registered together in one policy'
    test_data: |-
      Keyword payload: string containing the token
      Regex payload: sample string matching CUSTOM_REGEX
    expected_results: The two rules of one policy each block their own data, and a row is logged for each request.
    actual_result: The keyword payload was blocked, but the payload matching only the regex was not blocked (HTTP 200)
BAT-FW-001:
  test_steps: |-
    1. 정책 전에 대상 도메인(ECHO_HOSTS)마다 이름이 해석되는지 확인(기준선, 해석 안 되면 그 대상은 UNVERIFIED)
    2. rule FQDN IS [httpbin.org, postman-echo.com, httpbingo.org]로 BLOCK DNS Firewall 정책 생성
    3. 도메인마다 nslookup이 실패(또는 lguplus의 DNS 차단 페이지 주소)할 때까지 전파 시간 동안 반복 조회
    4. 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    6. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
  test_parameters: |-
    subject: FQDN
    condition: IS
    action_type: BLOCK
    kind(이벤트 로그 종류): dns
  test_data: |-
    rule value: ECHO_HOSTS(httpbin.org, postman-echo.com, httpbingo.org)
    정책명: BAT-FW-001-<run_id>(동적 생성, resource_name)
    조회 로그: SIA.log.dns_security_log
  expected_results: 정책 전에는 해석되던 대상 도메인들이 정책 뒤 해석에 실패하고, 도메인마다 그 조회의 BLOCK 행이 DNS 보안로그에 남는다.
  en:
    scenario: When a domain is blocked with DNS Firewall, name resolution actually fails and an event is logged.
    test_steps: |-
      1. Before the policy, check that the name resolves for each target domain (ECHO_HOSTS) (baseline; if it does not resolve, that target is UNVERIFIED)
      2. Create a BLOCK DNS Firewall policy with rule FQDN IS [httpbin.org, postman-echo.com, httpbingo.org]
      3. For each domain, repeat the lookup for the propagation time until nslookup fails (or returns the DNS block page address on lguplus)
      4. After that lookup, check that a new DNS log row of this policy (A record, identified by the row ids before and after the lookup) is logged as BLOCK (if there is no row, a resolution failure is not accepted as a policy block, FAIL)
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      6. Delete the policy (re-read the list to confirm it is gone)
    test_parameters: |-
      subject: FQDN
      condition: IS
      action_type: BLOCK
      kind (event log type): dns
    test_data: |-
      rule value: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
      Policy name: BAT-FW-001-<run_id> (generated dynamically, resource_name)
      Log queried: SIA.log.dns_security_log
    expected_results: The target domains that resolved before the policy fail to resolve after the policy, and for each domain a BLOCK row of that lookup is logged in the DNS security log.
BAT-FW-002:
  test_steps: |-
    1. 정책 전에 대상 도메인(ECHO_HOSTS)마다 이름이 해석되는지 확인(기준선)
    2. FQDN BLOCK DNS Firewall 정책 생성 후 도메인마다 해석 실패와 그 조회의 정책 행(A 레코드)을 확인
    3. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
    4. 도메인마다 주소가 담긴 응답이 다시 올 때까지 반복 조회
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: FQDN
    condition: IS
    action_type: BLOCK(생성 후 삭제)
  test_data: |-
    rule value: ECHO_HOSTS(httpbin.org, postman-echo.com, httpbingo.org)
    정책명: BAT-FW-002-<run_id>(동적 생성)
  expected_results: 정책이 실제로 막았다는 것(해석 실패 + 정책 행)을 보인 뒤, 삭제하면 도메인마다 이름 해석이 다시 정상 동작한다.
  en:
    scenario: After a DNS Firewall policy is deleted, domain name resolution works normally again.
    test_steps: |-
      1. Before the policy, check that each target domain (ECHO_HOSTS) resolves (baseline)
      2. After creating an FQDN BLOCK DNS Firewall policy, check for each domain that resolution fails and that the policy's row for that lookup (A record) exists
      3. Delete the policy (re-read the list to confirm it is gone)
      4. Query repeatedly until a response containing an address returns for each domain
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: |-
      subject: FQDN
      condition: IS
      action_type: BLOCK (created, then deleted)
    test_data: |-
      rule value: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
      policy name: BAT-FW-002-<run_id> (generated dynamically)
    expected_results: After showing that the policy actually blocked (resolution failure + policy row), deleting it makes name resolution work normally again for each domain.
BAT-FW-003:
  test_steps: |-
    1. httpbin.org를 IP 하나로 해석하고, 정책 전에 그 IP로 붙인(pin_ip) 요청이 응답하는지 확인(기준선)
    2. source 0.0.0.0/0, destination [그 IP]로 BLOCK Application Firewall 정책 생성
    3. 그 IP로 붙인 curl 요청의 연결이 끊길(000) 때까지 반복
    4. 이 정책의 새 방화벽 로그 행이 dst_ip가 그 IP인 BLOCK으로 남는지 확인(행이 없으면 연결 실패를 정책 차단으로 인정하지 않음)
    5. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
  test_parameters: |-
    subject.source.ip_address: ["0.0.0.0/0"]
    subject.destination.ip_address: [동적 resolve된 destination_ip]
    action_type: BLOCK
    kind(이벤트 로그 종류): firewall
  test_data: |-
    대상 URL: https://httpbin.org/get(BLOCK_TARGET_URL)
    대상 호스트: httpbin.org(BLOCK_TARGET_HOST), resolve_ip로 얻은 실제 IP(동적)
    source_ips: ["0.0.0.0/0"]
    정책명: BAT-FW-003-<run_id>(동적 생성)
  expected_results: 정책 전에는 응답하던 목적지 IP로의 연결이 정책 뒤 끊기고, dst_ip가 그 IP인 BLOCK 행이 방화벽 보안로그에 남는다.
  en:
    scenario: Blocking a destination with Application Firewall actually drops the connection and leaves an event.
    test_steps: |-
      1. Resolve httpbin.org to one IP, and before the policy check that a request pinned to that IP (pin_ip) gets a response (baseline)
      2. Create a BLOCK Application Firewall policy with source 0.0.0.0/0 and destination [that IP]
      3. Repeat until the connection of the curl request pinned to that IP is dropped (000)
      4. Check that a new firewall log row of this policy remains as BLOCK with dst_ip equal to that IP (without a row, a connection failure is not accepted as a policy block)
      5. Delete the policy (re-read the list to confirm it is gone)
    test_parameters: |-
      subject.source.ip_address: ["0.0.0.0/0"]
      subject.destination.ip_address: [destination_ip resolved dynamically]
      action_type: BLOCK
      kind (event log type): firewall
    test_data: |-
      target URL: https://httpbin.org/get (BLOCK_TARGET_URL)
      target host: httpbin.org (BLOCK_TARGET_HOST), the actual IP obtained with resolve_ip (dynamic)
      source_ips: ["0.0.0.0/0"]
      policy name: BAT-FW-003-<run_id> (generated dynamically)
    expected_results: The connection to the destination IP, which responded before the policy, is dropped after the policy, and a BLOCK row with dst_ip equal to that IP remains in the firewall security log.
BAT-FW-004:
  test_steps: |-
    1. httpbin.org IP로 붙인 요청이 정책 전에 응답하는지 확인(기준선)
    2. 그 IP로 BLOCK Application Firewall 정책 생성, 연결 끊김과 dst_ip가 그 IP인 정책 행 확인
    3. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
    4. 그 IP로 붙인 요청이 전달(delivered)될 때까지 반복. 끝내 연결이 끊겨 있으면 FAIL, 연결은 되지만 403·5xx면 UNVERIFIED
  test_parameters: |-
    subject.source.ip_address: ["0.0.0.0/0"]
    subject.destination.ip_address: [동적 resolve된 destination_ip]
    action_type: BLOCK(생성 후 삭제)
  test_data: |-
    대상 URL: https://httpbin.org/get(BLOCK_TARGET_URL)
    대상 호스트: httpbin.org(BLOCK_TARGET_HOST), resolve_ip로 얻은 실제 IP(동적)
    source_ips: ["0.0.0.0/0"]
    정책명: BAT-FW-004-<run_id>(동적 생성)
  expected_results: 차단 단계에서 연결 끊김과 정책 행이 확인되고, 정책 삭제 후 같은 IP로의 요청이 다시 정상 응답(전달)된다.
  en:
    scenario: After an Application Firewall policy is deleted, connections to the destination work normally again.
    test_steps: |-
      1. Check that a request pinned to the httpbin.org IP gets a response before the policy (baseline)
      2. Create a BLOCK Application Firewall policy for that IP, and check the connection drop and the policy row with dst_ip equal to that IP
      3. Delete the policy (re-read the list to confirm it is gone)
      4. Repeat until a request pinned to that IP is delivered. FAIL if the connection stays dropped to the end; UNVERIFIED if the connection is made but the response is 403 or 5xx
    test_parameters: |-
      subject.source.ip_address: ["0.0.0.0/0"]
      subject.destination.ip_address: [destination_ip resolved dynamically]
      action_type: BLOCK (created, then deleted)
    test_data: |-
      target URL: https://httpbin.org/get (BLOCK_TARGET_URL)
      target host: httpbin.org (BLOCK_TARGET_HOST), the actual IP obtained with resolve_ip (dynamic)
      source_ips: ["0.0.0.0/0"]
      policy name: BAT-FW-004-<run_id> (generated dynamically)
    expected_results: The connection drop and the policy row are confirmed in the block phase, and after the policy is deleted a request to the same IP is answered normally (delivered) again.
BAT-FW-005:
  test_steps: |-
    1. httpbin.org IP로 붙인 HTTP 요청이 정책 전에 응답하는지, 그 IP로의 ping이 응답하는지 확인(기준선)
    2. source 0.0.0.0/0, destination [그 IP], protocol 1(ICMP)로 BLOCK Application Firewall 정책 생성
    3. 그 IP로 붙인 HTTP 요청이 전파 예산 내내와 그 뒤 3번 연속 전달되는지 확인(끊기면 FAIL)
    4. 양성 확인: 같은 IP로의 ping이 막히고 이 정책의 방화벽 행(dst_ip)이 남는지 확인. 정책 전에도 ping이 응답하지 않았거나 정책 뒤에도 응답하면 정책 적용을 보일 수 없어 UNVERIFIED
    5. 정책 삭제
  test_parameters: |-
    protocol: 1(ICMP) — 17(UDP)/6(TCP)/253(미할당)도 별도 실측, 전부 결과 동일
    source_ips: ["0.0.0.0/0"], destination_ips: [resolved IP]
  test_data: BLOCK_TARGET_URL (HTTP/TCP 요청)
  expected_results: ICMP로 좁힌 정책이 걸려 있어도 HTTP(TCP)는 계속 통과하고, 같은 목적지의 ICMP는 막히며 그 정책의 행이 남는다.
  actual_result: ICMP(protocol 1)로 좁힌 정책이 대상 IP로 가는 HTTP(TCP) 연결까지 끊음
  en:
    scenario: An Application Firewall policy with a protocol specified blocks only that protocol.
    test_steps: |-
      1. Check that an HTTP request pinned to the httpbin.org IP gets a response before the policy, and that ping to that IP gets a response (baseline)
      2. Create a BLOCK Application Firewall policy with source 0.0.0.0/0, destination [that IP], and protocol 1 (ICMP)
      3. Check that the HTTP request pinned to that IP is delivered throughout the propagation budget and then 3 times in a row afterwards (FAIL if it is dropped)
      4. Positive check: confirm that ping to the same IP is blocked and that a firewall row (dst_ip) of this policy remains. UNVERIFIED if ping did not respond even before the policy or still responds after it, because policy enforcement cannot be shown
      5. Delete the policy
    test_parameters: |-
      protocol: 1 (ICMP) - 17 (UDP) / 6 (TCP) / 253 (unassigned) were also measured separately, all with the same result
      source_ips: ["0.0.0.0/0"], destination_ips: [resolved IP]
    test_data: BLOCK_TARGET_URL (HTTP/TCP request)
    expected_results: Even with a policy narrowed to ICMP in place, HTTP (TCP) keeps passing, while ICMP to the same destination is blocked and a row of that policy remains.
    actual_result: The policy narrowed to ICMP (protocol 1) also dropped HTTP (TCP) connections to the target IP
BAT-FW-006:
  test_steps: |-
    1. 정책 전에 httpbin.org, example.com, www.iana.org가 해석되는지 확인(기준선)
    2. rule FQDN IS [httpbin.org, example.com]으로 BLOCK DNS Firewall 정책 생성
    3. httpbin.org와 example.com 각각 해석 실패와 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    4. 목록에 없는 www.iana.org는 계속 해석되는지 확인(막히면 FAIL)
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, value: [httpbin.org, example.com]'
  test_data: httpbin.org, example.com(차단 대상) / www.iana.org(비교 대상, 목록 밖)
  expected_results: 한 rule에 넣은 두 도메인만 해석이 실패하고(각자 정책 행이 남음) 목록에 없는 도메인은 계속 해석된다.
  en:
    scenario: When several domains are put in one DNS Firewall rule, only those domains are blocked and the rest pass.
    test_steps: |-
      1. Before the policy, check that httpbin.org, example.com and www.iana.org resolve (baseline)
      2. Create a BLOCK DNS Firewall policy with rule FQDN IS [httpbin.org, example.com]
      3. For each of httpbin.org and example.com, check that resolution fails and that, after that lookup, a new DNS log row of this policy (A record, distinguished by the row ids before and after the lookup) remains as BLOCK (without a row, a resolution failure is not accepted as a policy block, FAIL)
      4. Check that www.iana.org, which is not in the list, keeps resolving (FAIL if it is blocked)
      5. Delete the policy
    test_parameters: 'Subject: FQDN, value: [httpbin.org, example.com]'
    test_data: httpbin.org, example.com (block targets) / www.iana.org (comparison target, not in the list)
    expected_results: Only the two domains put in one rule fail to resolve (each leaves a policy row), and the domain not in the list keeps resolving.
BAT-FW-007:
  test_steps: |-
    1. 정책 전에 iana.org와 www.iana.org가 해석되는지 확인(기준선)
    2. rule FQDN IS [iana.org]로 BLOCK DNS Firewall 정책 생성
    3. iana.org 해석 실패와 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    4. www.iana.org는 계속 해석되는지 확인(막히면 FAIL)
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, value: [iana.org]'
  test_data: iana.org(apex, 차단 대상), www.iana.org(서브도메인, 비교 대상)
  expected_results: apex(iana.org)만 막고(정책 행 남음) 서브도메인(www.iana.org)은 해석된다.
  en:
    scenario: Even if DNS Firewall blocks a parent (apex) domain, its subdomains are treated separately.
    test_steps: |-
      1. Before the policy, check that iana.org and www.iana.org resolve (baseline)
      2. Create a BLOCK DNS Firewall policy with rule FQDN IS [iana.org]
      3. Check that iana.org resolution fails and that, after that lookup, a new DNS log row of this policy (A record, distinguished by the row ids before and after the lookup) remains as BLOCK (without a row, a resolution failure is not accepted as a policy block, FAIL)
      4. Check that www.iana.org keeps resolving (FAIL if it is blocked)
      5. Delete the policy
    test_parameters: 'Subject: FQDN, value: [iana.org]'
    test_data: iana.org (apex, block target), www.iana.org (subdomain, comparison target)
    expected_results: Only the apex (iana.org) is blocked (a policy row remains) and the subdomain (www.iana.org) resolves.
BAT-FW-009:
  test_steps: |-
    1. 정책 전에 대상 도메인(ECHO_HOSTS)마다 대문자 이름이 해석되는지 확인(기준선)
    2. 도메인을 소문자로 넣은 FQDN BLOCK DNS Firewall 정책 생성
    3. 도메인마다 대문자 이름의 해석 실패와 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    4. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, value: [httpbin.org, postman-echo.com, httpbingo.org]'
  test_data: HTTPBIN.ORG, POSTMAN-ECHO.COM, HTTPBINGO.ORG (대문자 조회)
  expected_results: 소문자로 막은 도메인을 대문자로 조회해도 해석이 실패하고 그 조회의 정책 행이 남는다.
  en:
    scenario: The FQDN condition of DNS Firewall matches regardless of letter case.
    test_steps: |-
      1. Before the policy, check that the uppercase name of each target domain (ECHO_HOSTS) resolves (baseline)
      2. Create an FQDN BLOCK DNS Firewall policy with the domains in lowercase
      3. For each domain, check that resolution of the uppercase name fails and that, after that lookup, a new DNS log row of this policy (A record, distinguished by the row ids before and after the lookup) remains as BLOCK (without a row, a resolution failure is not accepted as a policy block, FAIL)
      4. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      5. Delete the policy
    test_parameters: 'Subject: FQDN, value: [httpbin.org, postman-echo.com, httpbingo.org]'
    test_data: HTTPBIN.ORG, POSTMAN-ECHO.COM, HTTPBINGO.ORG (uppercase lookups)
    expected_results: Even when domains blocked in lowercase are looked up in uppercase, resolution fails and a policy row for that lookup remains.
BAT-FW-010:
  test_steps: |-
    1. 정책 전에 httpbin.org가 해석되는지 확인(기준선)
    2. LOGGING probe 정책으로 DNS 로그에서 커넥터 사용자 id를 알아냄
    3. 다른 사용자 id로 좁힌 BLOCK 정책: 전파 예산 내내와 그 뒤 3번 연속 해석되는지 확인(한 번이라도 막히면 FAIL)
    4. 커넥터 사용자 id로 좁힌 BLOCK 정책: 해석 실패와 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, users: [다른 id] 그리고 [실사용자 id]'
  test_data: httpbin.org
  expected_results: 다른 사용자로 좁힌 정책은 이 단말을 막지 않고, 커넥터 사용자로 좁힌 정책은 막으며 그 정책 행이 남는다.
  en:
    scenario: A DNS Firewall policy applies only to the users specified in it and does not apply to other users.
    test_steps: |-
      1. Before the policy, check that httpbin.org resolves (baseline)
      2. Find the connector user id in the DNS log with a LOGGING probe policy
      3. BLOCK policy narrowed to another user id: check that it resolves throughout the propagation budget and then 3 times in a row afterwards (FAIL if it is blocked even once)
      4. BLOCK policy narrowed to the connector user id: check that resolution fails and that, after that lookup, a new DNS log row of this policy (A record, distinguished by the row ids before and after the lookup) remains as BLOCK (without a row, a resolution failure is not accepted as a policy block, FAIL)
      5. Delete the policy
    test_parameters: 'Subject: FQDN, users: [another id] and then [actual user id]'
    test_data: httpbin.org
    expected_results: The policy narrowed to another user does not block this endpoint, and the policy narrowed to the connector user blocks it and its policy row remains.
BAT-FW-011:
  test_steps: |-
    1. 정책 전 기준선: 도메인마다 AAAA 조회가 IPv6 주소를 돌려주는지 확인(없던 도메인은 그 도메인만 UNVERIFIED)
    2. FQDN=[example.com, example.net, postman-echo.com] BLOCK 정책 하나 생성(AAAA 레코드가 실제로 있는 도메인. httpbin.org는 AAAA가 없어 제외)
    3. 도메인마다 A 레코드 조회 차단 확인
    4. 도메인마다 AAAA(IPv6) 조회도 차단되는지 확인(실패 문구가 있거나 기준선에 있던 IPv6 주소가 없어지면 차단)
    5. 그 AAAA 조회 뒤 이 정책의 새 DNS 로그 행이 record_type AAAA, action BLOCK으로 남는지 확인(조회 전후 행 id로 그 조회의 행을 가림)
    6. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: 'Subject: FQDN, value: [example.com, example.net, postman-echo.com]'
  test_data: nslookup -type=AAAA <도메인> (example.com, example.net, postman-echo.com, 모두 AAAA 레코드가 있는 도메인)
  expected_results: A/AAAA 둘 다 막히고 AAAA 차단이 DNS 로그에 record_type AAAA, action BLOCK으로 남는다 - 듀얼스택 우회 불가
  en:
    scenario: A DNS Firewall block blocks not only A record lookups but also AAAA (IPv6) lookups.
    test_steps: |-
      1. Baseline before the policy: check for each domain that an AAAA lookup returns an IPv6 address (a domain that had none is UNVERIFIED for that domain only)
      2. Create one BLOCK policy with FQDN=[example.com, example.net, postman-echo.com] (domains that actually have AAAA records; httpbin.org is excluded because it has no AAAA)
      3. Check that the A record lookup is blocked for each domain
      4. Check that the AAAA (IPv6) lookup is also blocked for each domain (blocked if a failure message appears or the IPv6 address that was in the baseline disappears)
      5. Check that after that AAAA lookup a new DNS log row of this policy remains with record_type AAAA and action BLOCK (the row of that lookup is distinguished by the row ids before and after the lookup)
      6. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: 'Subject: FQDN, value: [example.com, example.net, postman-echo.com]'
    test_data: nslookup -type=AAAA <domain> (example.com, example.net, postman-echo.com, all domains that have AAAA records)
    expected_results: Both A and AAAA are blocked, and the AAAA block remains in the DNS log with record_type AAAA and action BLOCK - no dual-stack bypass.
BAT-FW-012:
  test_steps: |-
    1. 정책 전에 www.iana.org와 iana.org가 해석되는지 확인(기준선)
    2. rule FQDN IS [*.iana.org]로 BLOCK DNS Firewall 정책 생성
    3. www.iana.org 해석 실패와 그 조회 뒤 이 정책의 새 DNS 로그 행(A 레코드, 조회 전후 행 id로 가림)이 BLOCK으로 남는지 확인(행이 없으면 해석 실패를 정책 차단으로 인정하지 않음, FAIL)
    4. iana.org는 계속 해석되는지 확인(막히면 FAIL)
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, value: [*.iana.org]'
  test_data: www.iana.org(서브도메인, 차단 대상), iana.org(apex, 비교 대상)
  expected_results: 와일드카드 값은 서브도메인만 막고(정책 행 남음) apex는 막지 않는다.
  en:
    scenario: Entering a value as a wildcard such as `*.domain` can block all subdomains.
    test_steps: |-
      1. Before the policy, check that www.iana.org and iana.org resolve (baseline)
      2. Create a BLOCK DNS Firewall policy with rule FQDN IS [*.iana.org]
      3. Check that www.iana.org resolution fails and that, after that lookup, a new DNS log row of this policy (A record, distinguished by the row ids before and after the lookup) remains as BLOCK (without a row, a resolution failure is not accepted as a policy block, FAIL)
      4. Check that iana.org keeps resolving (FAIL if it is blocked)
      5. Delete the policy
    test_parameters: 'Subject: FQDN, value: [*.iana.org]'
    test_data: www.iana.org (subdomain, block target), iana.org (apex, comparison target)
    expected_results: The wildcard value blocks only subdomains (a policy row remains) and does not block the apex.
BAT-FW-013:
  test_steps: |-
    1. 정책 전에 httpbin.org가 해석되는지 확인(기준선)
    2. httpbin.org에 LOGGING 웹 정책을 걸고, 이 단말이 보낸 마커 요청의 웹 보안로그 행을 받아 둠(비교 기준). 못 받으면 UNVERIFIED
    3. rule FQDN IS [httpbin.org]로 BLOCK DNS Firewall 정책 생성, 해석 실패와 그 조회의 정책 행 확인
    4. DNS 행의 user_id/user_name/src_ip(포트 제외)/src_country_code가 기준 웹 행과 같은지 비교(다르거나 비어 있으면 FAIL)
    5. 정책 삭제
  test_parameters: 'Subject: FQDN, value: [httpbin.org]'
  test_data: httpbin.org
  expected_results: DNS 차단 행의 사용자·출발지 IP·국가가 같은 단말의 웹 보안로그 행과 같은 값으로 기록된다.
  en:
    scenario: A DNS security log event contains the information needed for investigation, such as user, source IP and country.
    test_steps: |-
      1. Before the policy, check that httpbin.org resolves (baseline)
      2. Apply a LOGGING web policy to httpbin.org and keep the web security log row of a marker request sent by this endpoint (comparison reference). UNVERIFIED if it cannot be obtained
      3. Create a BLOCK DNS Firewall policy with rule FQDN IS [httpbin.org], and check the resolution failure and the policy row of that lookup
      4. Compare whether user_id/user_name/src_ip (port excluded)/src_country_code of the DNS row equal those of the reference web row (FAIL if they differ or are empty)
      5. Delete the policy
    test_parameters: 'Subject: FQDN, value: [httpbin.org]'
    test_data: httpbin.org
    expected_results: The user, source IP and country of the DNS block row are recorded with the same values as the web security log row of the same endpoint.
BAT-GEN-001:
  test_steps: |-
    1. ChatGPT 앱으로 GENAI_REQUEST_KEYWORD IN [password] LOGGING GenAI 정책 생성
    2. 목록을 다시 읽어 action_type(LOGGING), 키워드 rule 값([password]), 대상 앱(gen_ai_app)이 요청값과 같은지 비교
    3. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
  test_parameters: |-
    subject: GENAI_REQUEST_KEYWORD
    condition: IN
    action_type: LOGGING
    risk_level: Minor
    blockpage_id: 0
    gen_ai_app: [find_app("chatgpt")로 동적 조회된 앱 id]
  test_data: |-
    value: ["password"]
    rule id: 1
    policy_name: resource_name(case.case_id, run_context.run_id)로 실행 시마다 동적 생성(BAT-GEN-001-<run_id> 형태)
  expected_results: GenAI 키워드 정책이 요청한 동작·키워드·앱으로 저장되고, 삭제하면 목록에서 사라진다.
  en:
    scenario: When a GenAI keyword detection policy is created it is stored as requested, and when it is deleted it disappears.
    test_steps: |-
      1. Create a GENAI_REQUEST_KEYWORD IN [password] LOGGING GenAI policy for the ChatGPT app
      2. Re-read the list and compare whether action_type (LOGGING), the keyword rule value ([password]) and the target app (gen_ai_app) equal the requested values
      3. Delete the policy (re-read the list to confirm it is gone)
    test_parameters: |-
      subject: GENAI_REQUEST_KEYWORD
      condition: IN
      action_type: LOGGING
      risk_level: Minor
      blockpage_id: 0
      gen_ai_app: [app id looked up dynamically with find_app("chatgpt")]
    test_data: |-
      value: ["password"]
      rule id: 1
      policy_name: generated dynamically on each run with resource_name(case.case_id, run_context.run_id) (form BAT-GEN-001-<run_id>)
    expected_results: The GenAI keyword policy is stored with the requested action, keyword and app, and disappears from the list when deleted.
BAT-SWG-001:
  test_steps: |-
    대상 호스트(httpbin.org, postman-echo.com, httpbingo.org)마다 아래를 반복한다.
    1. HTTP_HOST 조건(IS, 그 호스트)으로 BLOCK 웹 정책을 생성한다
    2. 실제 브라우저로 https://<호스트>/get을 차단될 때까지 재시도 방문한다
    3. 응답이 차단 페이지임을 확인한다
    4. 보안 로그에서 정책명·action=BLOCK·대상 호스트가 일치하는 이벤트를 대기한다
    5. 이벤트에서 접속 사용자 식별 정보를 기록한다
    6. 정책을 삭제한다(temporary 컨텍스트 종료)
    7. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: HTTP_HOST
    condition: IS
    action_type: BLOCK
    risk_level: MAJOR
  test_data: 대상 호스트(ECHO_HOSTS)="httpbin.org, postman-echo.com, httpbingo.org", 방문 URL="https://<호스트>/get", 정책명은 resource_name(case_id, run_id, 호스트 이름)으로 실행마다 동적 생성
  expected_results: HTTP_HOST 조건으로 지정한 호스트를 BLOCK하면 실제 브라우저 접속이 차단 페이지로 이어지고, 보안 로그에 BLOCK 액션과 해당 호스트가 기록된 이벤트가 남아야 한다.
  en:
    scenario: A site blocked by the HTTP Host condition is actually blocked and recorded in the security log.
    test_steps: |-
      Repeat the following for each target host (httpbin.org, postman-echo.com, httpbingo.org).
      1. Create a BLOCK web policy with an HTTP_HOST condition (IS, that host)
      2. With a real browser, retry visiting https://<host>/get until it is blocked
      3. Check that the response is a block page
      4. Wait in the security log for an event whose policy name, action=BLOCK and target host match
      5. Record the identifying information of the connecting user from the event
      6. Delete the policy (end of the temporary context)
      7. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: |-
      subject: HTTP_HOST
      condition: IS
      action_type: BLOCK
      risk_level: MAJOR
    test_data: target hosts (ECHO_HOSTS)="httpbin.org, postman-echo.com, httpbingo.org", visit URL="https://<host>/get", policy name generated dynamically on each run with resource_name(case_id, run_id, host name)
    expected_results: When a host specified by the HTTP_HOST condition is set to BLOCK, a real browser connection must lead to a block page, and an event recording the BLOCK action and that host must remain in the security log.
BAT-SWG-002:
  test_steps: |-
    1. HTTP_HOST 조건(IS, httpbin.org)으로 BLOCK 웹 정책을 생성한다
    2. 양성 대조: 마커를 단 httpbin.org 요청이 차단되고, 그 요청(마커) 자신의 BLOCK 이벤트가 이 정책 id로 남는지 확인한다
    3. 정책과 무관한 사이트 여러 곳(https://www.iana.org/, https://example.net/, https://example.com/)을 각자 마커를 달아 브라우저로 방문해 모두 정상 접속되는지 확인한다
    4. 표지 요청: 마커를 단 httpbin.org 요청을 한 번 더 보내 그 행이 로그에 나타날 때까지 기다린다(안 나타나면 UNVERIFIED)
    5. 그 다음 무관한 사이트 요청들의 마커가 든 행이 이 정책으로 하나도 없는지 확인한다(부재 검증)
    6. 정책을 삭제한다
    7. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: HTTP_HOST
    condition: IS
    action_type: BLOCK
  test_data: 정책 대상 BLOCK_TARGET_HOST="httpbin.org", 실제 방문 URL(UNRELATED_URLS)="https://www.iana.org/", "https://example.net/", "https://example.com/"
  expected_results: 정책이 적용 중(대상 호스트 차단·이벤트 확인)인 상태에서 조건에 매칭되지 않는 사이트는 정상적으로 로드되고, 그 요청들에 대해 이 정책의 보안 이벤트가 전혀 발생하지 않아야 한다.
  en:
    scenario: Sites that do not match the policy are reached normally and no security log is left.
    test_steps: |-
      1. Create a BLOCK web policy with an HTTP_HOST condition (IS, httpbin.org)
      2. Positive control: check that a marked httpbin.org request is blocked and that the BLOCK event of that request itself (marker) remains with this policy id
      3. Visit several sites unrelated to the policy (https://www.iana.org/, https://example.net/, https://example.com/) with a browser, each with its own marker, and check that all are reached normally
      4. Marker request: send one more marked httpbin.org request and wait until its row appears in the log (UNVERIFIED if it does not appear)
      5. Then check that none of the rows containing the markers of the unrelated site requests belong to this policy (absence verification)
      6. Delete the policy
      7. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: |-
      subject: HTTP_HOST
      condition: IS
      action_type: BLOCK
    test_data: policy target BLOCK_TARGET_HOST="httpbin.org", actual visit URLs (UNRELATED_URLS)="https://www.iana.org/", "https://example.net/", "https://example.com/"
    expected_results: While the policy is in effect (target host blocked, event confirmed), sites that do not match the condition must load normally, and no security event of this policy must occur for those requests.
BAT-SWG-003:
  test_steps: |-
    1. 대상 호스트(ECHO_HOSTS)마다 LOGGING probe 정책으로 그 호스트의 카테고리를 알아냄(못 알아낸 호스트는 UNVERIFIED)
    2. 그 카테고리 id로 HTTP_CATEGORY LOGGING 정책 생성
    3. 마커를 단 URL을 브라우저로 방문해 렌더링되는지 확인
    4. 그 방문 자신의 행(마커)이 이 정책으로 남고, 행의 categories에 설정한 카테고리 id가 있는지 확인
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
    6. 정책 삭제
  test_parameters: |-
    1단계 probe: subject HTTP_HOST, condition IS, action_type LOGGING, risk_level MINOR
    2단계 본정책: subject HTTP_CATEGORY, condition IN, action_type LOGGING, risk_level MINOR
  test_data: 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 각 호스트 방문 시 실제로 매칭되는 카테고리 id는 probe 이벤트에서 동적으로 발견(하드코딩 아님)
  expected_results: 내장 카테고리 조건이 그 방문에 매칭되어 행이 남고, 행의 카테고리가 정책에 설정한 카테고리 id와 같다.
  en:
    scenario: The built-in HTTP category condition matches real traffic and is recorded in the event.
    test_steps: |-
      1. For each target host (ECHO_HOSTS), find that host's category with a LOGGING probe policy (a host whose category could not be found is UNVERIFIED)
      2. Create an HTTP_CATEGORY LOGGING policy with that category id
      3. Visit a marked URL with a browser and check that it renders
      4. Check that the row of that visit itself (marker) remains with this policy and that the row's categories contain the configured category id
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
      6. Delete the policy
    test_parameters: |-
      Step 1 probe: subject HTTP_HOST, condition IS, action_type LOGGING, risk_level MINOR
      Step 2 main policy: subject HTTP_CATEGORY, condition IN, action_type LOGGING, risk_level MINOR
    test_data: target hosts (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. The category id that actually matches each host visit is discovered dynamically from the probe event (not hard-coded)
    expected_results: The built-in category condition matches that visit and a row remains, and the row's category equals the category id configured in the policy.
BAT-SWG-004:
  test_steps: |-
    1. HTTP_HOST 조건(IS, httpbin.org)의 LOGGING probe 정책으로 커넥터가 로그인된 사용자(id/name)를 알아낸다
    2. /sia/v1/user/all 목록에서 커넥터 사용자가 아닌 다른 사용자(bystander) id를 찾는다
    3. bystander id에만 스코프된 HTTP_HOST BLOCK 정책을 생성하고, 전파 시간 내내 그리고 그 뒤 3회까지 BLOCK_TARGET_URL을 되풀이해 방문해 한 번도 차단되지 않는지 확인한다
    4. 해당 정책을 삭제하고, 이번엔 커넥터 사용자 id에만 스코프된 동일 조건 BLOCK 정책을 생성한다
    5. 같은 URL을 재방문해 차단됨을 확인한다
    6. 보안 로그 이벤트의 user_id가 커넥터 사용자 id와 일치하는지 확인한다
    7. 정책을 삭제한다
  test_parameters: |-
    subject: HTTP_HOST
    condition: IS
    action_type: BLOCK
    users: [bystander_id] → 이후 [connector_user_id]
    user_groups: []
  test_data: BLOCK_TARGET_HOST="httpbin.org". 커넥터 사용자 id/이름과 bystander id는 probe 이벤트 및 /sia/v1/user/all 조회로 실행마다 동적으로 발견
  expected_results: 정책이 지정한 사용자가 아닐 때는 트래픽이 차단되지 않고, 커넥터 자신의 사용자로 스코프를 바꾸면 차단되며 보안 로그 이벤트의 user_id가 그 사용자와 일치해야 한다.
  en:
    scenario: A policy applies only to the users specified in it and does not apply to other users.
    test_steps: |-
      1. Find the user (id/name) the connector is logged in as, using a LOGGING probe policy with an HTTP_HOST condition (IS, httpbin.org)
      2. From the /sia/v1/user/all list, find the id of another user (bystander) who is not the connector user
      3. Create an HTTP_HOST BLOCK policy scoped only to the bystander id, visit BLOCK_TARGET_URL repeatedly throughout the propagation time and then 3 more times, and check that it is never blocked
      4. Delete that policy, and this time create a BLOCK policy with the same condition scoped only to the connector user id
      5. Visit the same URL again and check that it is blocked
      6. Check that the user_id of the security log event equals the connector user id
      7. Delete the policy
    test_parameters: |-
      subject: HTTP_HOST
      condition: IS
      action_type: BLOCK
      users: [bystander_id] -> then [connector_user_id]
      user_groups: []
    test_data: BLOCK_TARGET_HOST="httpbin.org". The connector user id/name and the bystander id are discovered dynamically on each run from the probe event and the /sia/v1/user/all lookup
    expected_results: When the user is not the one specified by the policy, traffic must not be blocked; when the scope is changed to the connector's own user it must be blocked, and the user_id of the security log event must equal that user.
BAT-SWG-005:
  test_steps: |-
    대상 호스트(httpbin.org, postman-echo.com, httpbingo.org)마다 아래를 반복한다.
    1. 커스텀 카테고리를 생성한다(CustomCategoryFactory)
    2. 그 카테고리에 그 호스트를 등록하는 user rule을 생성한다(UserRuleFactory)
    3. HTTP_CATEGORY 조건(IN, 해당 카테고리 id)으로 BLOCK 웹 정책을 생성한다
    4. 브라우저로 https://<호스트>/get을 차단될 때까지 재시도 방문한다
    5. 차단됨을 확인한다
    6. 보안 로그에서 정책명·대상 호스트가 일치하는 이벤트를 확인한다
    7. 정책 → user rule → 카테고리 순으로 정리한다
    8. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: HTTP_CATEGORY
    condition: IN
    action_type: BLOCK
  test_data: category_name/policy_name은 resource_name()으로 동적 생성, 카테고리에 등록한 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org, 방문 URL="https://<호스트>/get"
  expected_results: 직접 만든 카테고리에 대상 호스트를 등록하고 그 카테고리를 조건으로 건 정책이 실제 트래픽을 차단하고 보안 로그에 남아야 한다.
  en:
    scenario: When a URL is registered in a self-made category, it is blocked by the policy of that category.
    test_steps: |-
      Repeat the following for each target host (httpbin.org, postman-echo.com, httpbingo.org).
      1. Create a custom category (CustomCategoryFactory)
      2. Create a user rule that registers that host in that category (UserRuleFactory)
      3. Create a BLOCK web policy with an HTTP_CATEGORY condition (IN, that category id)
      4. With a browser, retry visiting https://<host>/get until it is blocked
      5. Check that it is blocked
      6. Check in the security log for an event whose policy name and target host match
      7. Clean up in the order policy -> user rule -> category
      8. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed without any deviation
    test_parameters: |-
      subject: HTTP_CATEGORY
      condition: IN
      action_type: BLOCK
    test_data: category_name/policy_name are generated dynamically with resource_name(), hosts registered in the category (ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org, visit URL="https://<host>/get"
    expected_results: A policy that registers the target host in a self-made category and uses that category as its condition must block real traffic and leave a record in the security log.
BAT-SWG-008:
  test_steps: |-
    1. HTTP_HOST 조건(IS, httpbin.org)으로 LOGGING 정책을 생성한다
    2. 브라우저로 BLOCK_TARGET_URL을 방문한다
    3. 정상 허용(페이지 로드)됨을 확인한다
    4. 보안 로그에서 정책명·action=LOGGING·대상 호스트가 일치하는 이벤트를 대기한다
    5. 이벤트의 user_name이 비어있지 않은지 확인한다
    6. 정책을 삭제한다
  test_parameters: |-
    subject: HTTP_HOST
    condition: IS
    action_type: LOGGING
    risk_level: MINOR
  test_data: BLOCK_TARGET_HOST="httpbin.org", BLOCK_TARGET_URL="https://httpbin.org/get"
  expected_results: 커넥터가 연결된 상태에서는 허용된(차단되지 않은) 트래픽도 LOGGING 액션으로 보안 로그에 기록되고, 이벤트에 접속 사용자 이름이 채워져 있어야 한다.
  en:
    scenario: With the connector on, allowed traffic is also recorded in the log, and the user is identified.
    test_steps: |-
      1. Create a LOGGING policy with an HTTP_HOST condition (IS, httpbin.org)
      2. Visit BLOCK_TARGET_URL with a browser
      3. Check that it is allowed normally (page loads)
      4. Wait in the security log for an event whose policy name, action=LOGGING and target host match
      5. Check that the event's user_name is not empty
      6. Delete the policy
    test_parameters: |-
      subject: HTTP_HOST
      condition: IS
      action_type: LOGGING
      risk_level: MINOR
    test_data: BLOCK_TARGET_HOST="httpbin.org", BLOCK_TARGET_URL="https://httpbin.org/get"
    expected_results: While the connector is connected, allowed (not blocked) traffic is also recorded in the security log with the LOGGING action, and the connecting user name must be filled in on the event.
BAT-SWG-009:
  test_steps: |-
    1. 테스트 사용자 생성 후 다시 읽어 login_id가 같은지 확인
    2. 그 사용자만 대상으로 한(user_groups 비움) HTTP_HOST BLOCK 웹 정책 생성
    3. 정책을 다시 읽어 users가 정확히 그 사용자, user_groups가 비어 있음, action_type BLOCK인지 비교(다르면 FAIL)
    4. 정책과 사용자 삭제
  test_parameters: |-
    새 사용자 login_id: bat-<case_id>-<run_id>@bat.local, role: USER
    웹 정책 대상: users=[새 사용자 id], user_groups=[]
  test_data: POST /sia/v1/user {login_id, first_name:"BAT", last_name:"Tester", role:"USER"}
  expected_results: 새로 만든 사용자가 요청한 값 그대로 저장되고, 그 사용자만 대상으로 한 정책이 요청한 대상·동작으로 저장된다.
  en:
    scenario: A newly created user can be specified as a policy target, and deletion is also handled normally.
    test_steps: |-
      1. Create a test user, re-read it, and check that login_id is the same
      2. Create an HTTP_HOST BLOCK web policy targeting only that user (user_groups empty)
      3. Re-read the policy and compare that users is exactly that user, user_groups is empty and action_type is BLOCK (FAIL if different)
      4. Delete the policy and the user
    test_parameters: |-
      new user login_id: bat-<case_id>-<run_id>@bat.local, role: USER
      web policy target: users=[new user id], user_groups=[]
    test_data: POST /sia/v1/user {login_id, first_name:"BAT", last_name:"Tester", role:"USER"}
    expected_results: The newly created user is stored with exactly the requested values, and the policy targeting only that user is stored with the requested target and action.
BAT-SWG-010:
  test_steps: |-
    1. 같은 호스트(httpbin.org)에 ALLOW와 BLOCK 웹 정책 생성
    2. BLOCK을 우선순위 1로: 마커를 단 curl 요청이 차단되고 그 요청 자신의 BLOCK 정책 행이 남는지 확인
    3. ALLOW를 우선순위 1로 바꿈(REST로는 priority를 다시 읽을 수 없어 트래픽으로 확인)
    4. 전파 예산 안에 통과가 시작되고, 예산이 지난 뒤 3번 연속 통과하는지 확인
    5. 정책 삭제
  test_parameters: |-
    subject: HTTP_HOST
    condition: IS
    action_type: ALLOW와 BLOCK(동일 rule 재사용)
    risk_level(BLOCK): MAJOR
    priority 1차: BLOCK=1,ALLOW=2 / 2차: ALLOW=1,BLOCK=2
  test_data: BLOCK_TARGET_HOST="httpbin.org", BLOCK_TARGET_URL="https://httpbin.org/get" (curl 기반 트래픽, 브라우저 아님)
  expected_results: 우선순위가 높은 정책이 판정을 정하고, 순서를 바꾸면 결과가 바뀌어 그대로 유지된다.
  en:
    scenario: Priority decides the verdict of overlapping ALLOW/BLOCK, and changing the order changes the result.
    test_steps: |-
      1. Create ALLOW and BLOCK web policies for the same host (httpbin.org)
      2. With BLOCK at priority 1: check that a marked curl request is blocked and that the BLOCK policy row of that request itself remains
      3. Change ALLOW to priority 1 (priority cannot be re-read via REST, so confirm with traffic)
      4. Check that passing starts within the propagation budget, and that it passes 3 times in a row after the budget has passed
      5. Delete the policy
    test_parameters: |-
      subject: HTTP_HOST
      condition: IS
      action_type: ALLOW and BLOCK (same rule reused)
      risk_level (BLOCK): MAJOR
      priority 1st: BLOCK=1, ALLOW=2 / 2nd: ALLOW=1, BLOCK=2
    test_data: BLOCK_TARGET_HOST="httpbin.org", BLOCK_TARGET_URL="https://httpbin.org/get" (curl-based traffic, not a browser)
    expected_results: The higher-priority policy decides the verdict, and when the order is changed the result changes and stays that way.
BAT-SWG-011:
  test_steps: |-
    1. LOGGING 정책(HTTP_HOST)으로 이 러너 트래픽을 발생시켜 보안로그에서 src_ip 식별
    2. SOURCE_IP LOGGING 정책 생성(식별된 src_ip/32) — BLOCK 아님, 자기잠금 방지(5.39)
    3. 대상 URL 재방문, 정상 로드(차단 아님) 확인
    4. 보안로그 + 감사로그 둘 다에서 이벤트 확인
    5. 정책 삭제
  test_parameters: 'Subject: SOURCE_IP, Condition: IS, Value: "<src_ip>/32" (discovery 단계에서 동적으로 결정)'
  test_data: discovery로 얻은 이 러너의 실제 출발지 IP (고정값 아님, 실행마다 다를 수 있음)
  expected_results: 조건이 실제 트래픽과 매칭되어 보안로그·감사로그에 LOGGING 이벤트로 남는다(차단 여부는 검증 안 함)
  en:
    scenario: Blocking this runner's source IP with SOURCE_IP actually blocks it, and the result is recorded in both the security log and the audit log.
    test_steps: |-
      1. Generate this runner's traffic with a LOGGING policy (HTTP_HOST) and identify src_ip in the security log
      2. Create a SOURCE_IP LOGGING policy (identified src_ip/32) - not BLOCK, to avoid locking out the runner (5.39)
      3. Revisit the target URL and confirm it loads normally (not blocked)
      4. Confirm the event in both the security log and the audit log
      5. Delete the policy
    test_parameters: 'Subject: SOURCE_IP, Condition: IS, Value: "<src_ip>/32" (determined dynamically in the discovery step)'
    test_data: The runner's actual source IP obtained by discovery (not a fixed value; may differ on each run)
    expected_results: The condition matches the actual traffic and is recorded as a LOGGING event in the security log and the audit log (blocking is not verified)
BAT-SWG-012:
  test_steps: |-
    1. LOGGING 정책(HTTP_HOST)으로 이 러너 트래픽을 발생시켜 보안로그에서 자기 트래픽의 src_country_code를 식별
    2. SOURCE_IP_GEO BLOCK 정책 생성(식별된 국가코드)
    3. 대상 URL 재방문해 차단 확인
    4. 보안로그 + 감사로그 둘 다에서 이벤트 확인
    5. 정책 삭제
  test_parameters: 'Subject: SOURCE_IP_GEO, Condition: IN(IS는 거부됨), Value: [<ISO 국가코드>]'
  test_data: discovery로 얻은 이 러너의 실제 접속 출발 국가코드 (고정값 아님)
  expected_results: 차단 확인 + 보안로그 이벤트 + 감사로그 이벤트 모두 성공
  en:
    scenario: Verify with SOURCE_IP_GEO that the country this runner actually connects from matches the condition.
    test_steps: |-
      1. Generate this runner's traffic with a LOGGING policy (HTTP_HOST) and identify the src_country_code of its own traffic in the security log
      2. Create a SOURCE_IP_GEO BLOCK policy (identified country code)
      3. Revisit the target URL and confirm it is blocked
      4. Confirm the event in both the security log and the audit log
      5. Delete the policy
    test_parameters: 'Subject: SOURCE_IP_GEO, Condition: IN (IS is rejected), Value: [<ISO country code>]'
    test_data: The country code this runner actually connects from, obtained by discovery (not a fixed value)
    expected_results: Block confirmed + security log event + audit log event all succeed
BAT-SWG-013:
  test_steps: |-
    1. LOGGING 정책(HTTP_HOST)으로 이 러너 트래픽을 발생시켜 보안로그에서 목적지 dst_country_code를 식별
    2. DESTINATION_IP_GEO BLOCK 정책 생성(식별된 국가코드)
    3. 대상 URL 재방문해 차단 확인
    4. 보안로그 + 감사로그 둘 다에서 이벤트 확인
    5. 정책 삭제
  test_parameters: 'Subject: DESTINATION_IP_GEO, Condition: IN(IS는 거부됨), Value: [<ISO 국가코드>]'
  test_data: discovery로 얻은 목적지 사이트의 호스팅 국가코드 (고정값 아님)
  expected_results: LOGGING 조건(DESTINATION_IP_GEO IN country)이 실제 트래픽과 매칭되어 보안로그·감사로그에 남는다(2026-10-06부로 BLOCK에서 LOGGING으로 전환 — 국가 단위 차단은 넓은 조건으로 취급)
  en:
    scenario: Verify with DESTINATION_IP_GEO that the hosting country of the destination site matches the condition.
    test_steps: |-
      1. Generate this runner's traffic with a LOGGING policy (HTTP_HOST) and identify the destination dst_country_code in the security log
      2. Create a DESTINATION_IP_GEO BLOCK policy (identified country code)
      3. Revisit the target URL and confirm it is blocked
      4. Confirm the event in both the security log and the audit log
      5. Delete the policy
    test_parameters: 'Subject: DESTINATION_IP_GEO, Condition: IN (IS is rejected), Value: [<ISO country code>]'
    test_data: The hosting country code of the destination site, obtained by discovery (not a fixed value)
    expected_results: The LOGGING condition (DESTINATION_IP_GEO IN country) matches the actual traffic and is recorded in the security log and the audit log (switched from BLOCK to LOGGING as of 2026-10-06 - country-level blocking is treated as a broad condition)
BAT-SWG-014:
  test_steps: |-
    대상 호스트(httpbin.org, postman-echo.com, httpbingo.org)마다 아래를 반복한다.
    1. HTTP_URL 조건(IS, https://<호스트>/get 전체 URL)으로 BLOCK 웹 정책을 생성한다
    2. 브라우저로 그 URL을 차단될 때까지 재시도 방문해 차단됨을 확인한다
    3. 같은 호스트의 다른 경로(https://<호스트>/headers)를 방문해 정상 로드되는지 확인한다
    4. 보안 로그에서 정책명이 일치하는 이벤트를 대기한다
    5. audit_log에서 정책명을 포함하는 생성 기록을 확인한다
    6. 정책을 삭제한다
    7. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: HTTP_URL
    condition: IS
    action_type: BLOCK
    risk_level: MAJOR
    value: 스킴 포함 전체 URL
  test_data: 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 차단 대상 "https://<호스트>/get", 허용돼야 하는 같은 호스트의 다른 경로 "https://<호스트>/headers"
  expected_results: HTTP_URL 조건으로 정확한 URL 하나만 지정한 BLOCK 정책은 그 URL만 차단하고 같은 호스트의 다른 경로는 통과시켜야 하며, 보안 로그와 감사 로그 양쪽에 생성 기록이 남아야 한다.
  en:
    scenario: Blocking a single URL with HTTP_URL blocks only that URL; other paths on the same host pass.
    test_steps: |-
      Repeat the following for each target host (httpbin.org, postman-echo.com, httpbingo.org).
      1. Create a BLOCK web policy with an HTTP_URL condition (IS, full URL https://<host>/get)
      2. Visit that URL with a browser, retrying until it is blocked, and confirm it is blocked
      3. Visit a different path on the same host (https://<host>/headers) and confirm it loads normally
      4. Wait in the security log for an event whose policy name matches
      5. Confirm in the audit_log a creation record that contains the policy name
      6. Delete the policy
      7. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed, with no deviations
    test_parameters: |-
      subject: HTTP_URL
      condition: IS
      action_type: BLOCK
      risk_level: MAJOR
      value: full URL including scheme
    test_data: 'Target hosts (ECHO_HOSTS) = httpbin.org, postman-echo.com, httpbingo.org. URL to block: "https://<host>/get"; a different path on the same host that must be allowed: "https://<host>/headers"'
    expected_results: A BLOCK policy that specifies exactly one URL with an HTTP_URL condition must block only that URL and let other paths on the same host pass, and creation records must remain in both the security log and the audit log.
BAT-SWG-015:
  test_steps: |-
    1. HTTP_UPLOADFILE_EXTENSION IN [txt] BLOCK 웹 정책 생성
    2. 마커를 단 URL로 .txt 파일 업로드가 차단될 때까지 반복
    3. 마커가 다른 URL로 .csv 업로드가 통과하는지 확인
    4. 막힌 .txt 업로드 요청 자신의 행(마커)과 감사로그 확인
    5. 정책 삭제
  test_parameters: |-
    subject: HTTP_UPLOADFILE_EXTENSION
    condition: IN
    action_type: BLOCK
    risk_level: MAJOR
    value: ["txt"] (점 없이)
  test_data: POST_TARGET_URL="https://httpbin.org/post", 차단 대상 파일="<case_id>-<run_id>.txt", 허용 대상 파일="<case_id>-<run_id>.csv", 둘 다 내용은 "BAT upload-extension probe\n"
  expected_results: .txt 업로드만 막히고 그 요청의 행이 남으며, .csv 업로드는 통과한다.
  en:
    scenario: Blocking uploads of one specific extension with HTTP_UPLOADFILE_EXTENSION blocks only that extension.
    test_steps: |-
      1. Create an HTTP_UPLOADFILE_EXTENSION IN [txt] BLOCK web policy
      2. Repeat the .txt file upload to a marked URL until it is blocked
      3. Confirm that a .csv upload to a URL with a different marker passes
      4. Check the log row of the blocked .txt upload request itself (marker) and the audit log
      5. Delete the policy
    test_parameters: |-
      subject: HTTP_UPLOADFILE_EXTENSION
      condition: IN
      action_type: BLOCK
      risk_level: MAJOR
      value: ["txt"] (without the dot)
    test_data: POST_TARGET_URL="https://httpbin.org/post", file to block="<case_id>-<run_id>.txt", file to allow="<case_id>-<run_id>.csv", both with the content "BAT upload-extension probe\n"
    expected_results: Only the .txt upload is blocked and a row for that request is recorded; the .csv upload passes.
BAT-SWG-016:
  test_steps: |-
    1. ANTI_VIRUS 시그니처 모듈 정책(BLOCK) 생성
    2. EICAR 테스트 문자열을 바이트 그대로(앞 BOM·끝 줄바꿈 없이) 단말 임시 파일에 쓰고, 그대로 있는지 확인한 뒤 곧바로 curl로 업로드하고 지움. 단말 백신이 파일을 막거나 지워 올리지 못하면 UNVERIFIED(환경)
    3. 업로드가 차단되는지 최대 20초 반복 확인
    4. 끝까지 차단되지 않으면 마지막 업로드의 httpbin 에코가 보낸 바이트와 정확히 같은지 확인(그대로 전달됐으면 ANTI_VIRUS 미동작으로 FAIL, 응답이 없거나 전송 경로가 내용을 바꿨으면 UNVERIFIED)
    5. 보안로그 + 감사로그 확인, 정책 삭제
  test_parameters: |-
    Signature module: ANTI_VIRUS
    Upload filename: eicar.txt(eicar.com도 별도 실측)
    Target: POST_TARGET_URL
  test_data: EICAR_STRING (업계 표준 68바이트 EICAR 테스트 문자열 — 실제 악성코드 아님)
  expected_results: EICAR 업로드가 ANTI_VIRUS 시그니처에 의해 차단된다(차단 없이 내용 그대로 전달되면 FAIL)
  actual_result: EICAR 파일이 내용 그대로 전달됐지만 ANTI_VIRUS가 차단하지 않음
  en:
    scenario: With the ANTI_VIRUS signature on, uploading an EICAR test file is blocked.
    test_steps: |-
      1. Create an ANTI_VIRUS signature module policy (BLOCK)
      2. Write the EICAR test string byte for byte (no leading BOM, no trailing newline) to a temporary file on the endpoint, verify it is intact, then immediately upload it with curl and delete it. If the endpoint antivirus blocks or deletes the file so it cannot be uploaded, UNVERIFIED (environment)
      3. Repeatedly check for up to 20 seconds whether the upload is blocked
      4. If it is never blocked, check whether the httpbin echo of the last upload exactly equals the bytes sent (if delivered intact, FAIL because ANTI_VIRUS did not act; if there was no response or the transport path altered the content, UNVERIFIED)
      5. Check the security log + audit log, delete the policy
    test_parameters: |-
      Signature module: ANTI_VIRUS
      Upload filename: eicar.txt (eicar.com also measured separately)
      Target: POST_TARGET_URL
    test_data: EICAR_STRING (the industry-standard 68-byte EICAR test string - not real malware)
    expected_results: The EICAR upload is blocked by the ANTI_VIRUS signature (FAIL if it is delivered intact without being blocked)
    actual_result: The EICAR file was delivered intact but ANTI_VIRUS did not block it
BAT-SWG-017:
  test_steps: |-
    1. www.example.org를 C&C deny 목록에 추가
    2. 모듈 LOGGING 사본으로 목록 밖 매칭이 없는지 확인
    3. BLOCK_CNC_TRAFFIC BLOCK 정책 생성
    4. 마커를 단 www.example.org 요청이 차단되고 그 요청 자신의 정책 행이 남는지 확인
    5. 정책 삭제, deny 목록에서 제거
  test_parameters: |-
    Signature module: BLOCK_CNC_TRAFFIC
    Signature pattern: C&C deny_list += www.example.org
  test_data: |-
    www.example.org (BAT 전용 등록 값, 케이스가 끝나면 제거)
    대조 호스트: httpbin.org
  expected_results: C&C 목록에 등록한 대상 접속이 차단되고 그 요청의 행이 남는다.
  en:
    scenario: With BLOCK_CNC_TRAFFIC on, connections to a target registered in the Signature Management C&C deny list are blocked.
    test_steps: |-
      1. Add www.example.org to the C&C deny list
      2. Use a LOGGING copy of the module to confirm there are no matches outside the list
      3. Create a BLOCK_CNC_TRAFFIC BLOCK policy
      4. Confirm that a marked www.example.org request is blocked and that a policy row for that request itself is recorded
      5. Delete the policy, remove the entry from the deny list
    test_parameters: |-
      Signature module: BLOCK_CNC_TRAFFIC
      Signature pattern: C&C deny_list += www.example.org
    test_data: |-
      www.example.org (value registered only by BAT, removed when the case ends)
      Control host: httpbin.org
    expected_results: A connection to the target registered in the C&C list is blocked and a row for that request is recorded.
BAT-SWG-018:
  test_steps: |-
    1. HTTP_PATH=/get BLOCK 정책 생성(경로 조건은 호스트를 가리지 않으므로 정책 하나)
    2. 대상 호스트(httpbin.org, postman-echo.com, httpbingo.org)마다 https://<호스트>/get 접속 -> 차단 확인
    3. 같은 호스트의 https://<호스트>/headers(다른 경로) 접속 -> 통과 확인
    4. 호스트마다 그 호스트의 보안로그 이벤트 확인, 감사로그 확인, 정책 삭제
    5. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: 'Subject: HTTP_PATH, Condition: IS, value: ["/get"]'
  test_data: 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. https://<호스트>/get (차단 대상), https://<호스트>/headers (같은 호스트, 다른 경로)
  expected_results: /get만 차단되고 같은 호스트의 다른 경로(/headers)는 영향받지 않는다
  en:
    scenario: Blocking a specific path with HTTP_PATH blocks only that path; other paths on the same host pass.
    test_steps: |-
      1. Create an HTTP_PATH=/get BLOCK policy (a path condition does not select a host, so one policy)
      2. For each target host (httpbin.org, postman-echo.com, httpbingo.org), access https://<host>/get -> confirm it is blocked
      3. Access https://<host>/headers (a different path) on the same host -> confirm it passes
      4. For each host, check that host's security log event, check the audit log, delete the policy
      5. PASS if every target's result is as expected, FAIL if any one deviates, UNVERIFIED if there are only targets that could not be confirmed, with no deviations
    test_parameters: 'Subject: HTTP_PATH, Condition: IS, value: ["/get"]'
    test_data: Target hosts (ECHO_HOSTS) = httpbin.org, postman-echo.com, httpbingo.org. https://<host>/get (to be blocked), https://<host>/headers (same host, different path)
    expected_results: Only /get is blocked; other paths on the same host (/headers) are unaffected
BAT-SWG-019:
  test_steps: |-
    1. HTTP_METHOD=POST LOGGING 정책 생성(BLOCK 아님: 러너 자신의 POST까지 막음)
    2. 마커를 단 POST https://httpbin.org/post를 전파 시간 동안 되풀이해 보내, 그중 하나가 이 정책 id로 기록될 때까지 본다(러너 자신의 API POST 행은 마커가 없어 인정하지 않음)
    3. 기록된 그 요청이 차단되지 않았는지(LOGGING이라 통과) + 그 요청 자신의 LOGGING 이벤트 확인
    4. 음성 대조: 마커를 단 GET https://httpbin.org/get을 보내고, 그 뒤 보낸 POST 표지의 행이 나타난 다음 GET의 행이 이 정책으로 없는지 확인
    5. 감사로그 확인, 정책 삭제
  test_parameters: 'Subject: HTTP_METHOD, Condition: IN, value: ["POST"], action_type: LOGGING'
  test_data: POST https://httpbin.org/post (bat=probe)
  expected_results: 마커를 단 POST 요청이 조건과 매칭되어 그 요청의 LOGGING 이벤트가 남고 트래픽은 차단되지 않으며, 같은 호스트로 보낸 GET은 이 정책에 기록되지 않는다
  en:
    scenario: Verify that the HTTP_METHOD condition matches the method of actual traffic.
    test_steps: |-
      1. Create an HTTP_METHOD=POST LOGGING policy (not BLOCK: it would also block the runner's own POSTs)
      2. Send a marked POST https://httpbin.org/post repeatedly during the propagation time until one of them is logged with this policy id (the runner's own API POST rows have no marker and are not accepted)
      3. Confirm that the logged request was not blocked (passes because it is LOGGING) + confirm that request's own LOGGING event
      4. Negative control: send a marked GET https://httpbin.org/get, and after the row of a POST sentinel sent afterward appears, confirm that the GET's row does not exist for this policy
      5. Check the audit log, delete the policy
    test_parameters: 'Subject: HTTP_METHOD, Condition: IN, value: ["POST"], action_type: LOGGING'
    test_data: POST https://httpbin.org/post (bat=probe)
    expected_results: The marked POST request matches the condition and a LOGGING event for that request is recorded while the traffic is not blocked, and a GET sent to the same host is not recorded under this policy
BAT-SWG-020:
  test_steps: |-
    1. httpbin.org를 IP 하나로 해석하고 DESTINATION_IP IS [그 IP] BLOCK 웹 정책 생성
    2. 그 IP로 붙인(pin_ip) 마커 요청이 차단되는지 확인
    3. 다른 IP인 example.com은 통과하는지 확인
    4. 차단된 요청 자신의 정책 행(마커)과 감사로그 확인
    5. 정책 삭제
  test_parameters: 'Subject: DESTINATION_IP, Condition: IS, value: [해석된 IP 1개]'
  test_data: httpbin.org의 실제 IP (매 실행 시 nslookup으로 동적 확인), https://example.com/(비교 대상)
  expected_results: 지정한 IP로 가는 요청만 막히고 그 요청의 행이 남으며, 다른 IP는 통과한다.
  en:
    scenario: Blocking a single IP with DESTINATION_IP blocks only that IP; other destinations pass.
    test_steps: |-
      1. Resolve httpbin.org to one IP and create a DESTINATION_IP IS [that IP] BLOCK web policy
      2. Confirm that a marked request pinned to that IP (pin_ip) is blocked
      3. Confirm that example.com, which has a different IP, passes
      4. Check the policy row of the blocked request itself (marker) and the audit log
      5. Delete the policy
    test_parameters: 'Subject: DESTINATION_IP, Condition: IS, value: [one resolved IP]'
    test_data: The actual IP of httpbin.org (confirmed dynamically with nslookup on each run), https://example.com/ (comparison target)
    expected_results: Only requests going to the specified IP are blocked and a row for that request is recorded; other IPs pass.
BAT-SWG-021:
  test_steps: |-
    1. www.example.org를 Risky Website deny 목록에 추가
    2. 모듈 LOGGING 사본으로 목록 밖(www.wikipedia.org) 매칭이 없는지 확인. 매칭되면 BLOCK 없이 FAIL
    3. BLOCK_RISKY_WEBSITES BLOCK 정책 생성
    4. 마커를 단 www.example.org 요청이 차단되고 그 요청 자신의 정책 행이 남는지 확인
    5. 정책 삭제, deny 목록에서 제거
  test_parameters: |-
    Signature module: BLOCK_RISKY_WEBSITES
    Signature pattern: Risky Website deny_list += www.example.org
  test_data: |-
    www.example.org (BAT 전용 등록 값, 케이스가 끝나면 제거)
    대조 호스트: www.wikipedia.org
  expected_results: Risky Website 목록에 등록한 대상 접속이 차단되고 그 요청의 행이 남는다.
  actual_result: BLOCK_RISKY_WEBSITES가 목록에 없는 www.wikipedia.org까지 매칭해(LOGGING 확인), 러너 전체가 막힐 위험 때문에 BLOCK을 걸지 않음
  en:
    scenario: With BLOCK_RISKY_WEBSITES on, connections to a target registered in the Signature Management Risky Website deny list are blocked.
    test_steps: |-
      1. Add www.example.org to the Risky Website deny list
      2. Use a LOGGING copy of the module to confirm there are no matches outside the list (www.wikipedia.org). If it matches, FAIL without BLOCK
      3. Create a BLOCK_RISKY_WEBSITES BLOCK policy
      4. Confirm that a marked www.example.org request is blocked and that a policy row for that request itself is recorded
      5. Delete the policy, remove the entry from the deny list
    test_parameters: |-
      Signature module: BLOCK_RISKY_WEBSITES
      Signature pattern: Risky Website deny_list += www.example.org
    test_data: |-
      www.example.org (value registered only by BAT, removed when the case ends)
      Control host: www.wikipedia.org
    expected_results: A connection to the target registered in the Risky Website list is blocked and a row for that request is recorded.
    actual_result: BLOCK_RISKY_WEBSITES also matched www.wikipedia.org, which is not in the list (confirmed with LOGGING), so BLOCK was not applied because of the risk of blocking the entire runner
BAT-SWG-022:
  test_steps: |-
    1. httpbin.org를 IP로 해석하고 HTTP_HOST IS [httpbin.org] BLOCK 웹 정책 생성
    2. 마커를 단 호스트명 요청이 차단되고 그 요청 자신의 정책 행이 남는지 확인
    3. 같은 목적지를 IP로 직접 요청해 통과(전달)하는지 확인(막히면 FAIL, 응답이 없으면 UNVERIFIED)
    4. SSE가 IP 요청을 보는지는 LOGGING DESTINATION_IP 정책으로 근거만 남김
    5. 정책 삭제
  test_parameters: 'Subject: HTTP_HOST, condition: IS, value: [httpbin.org], action: BLOCK'
  test_data: |-
    https://httpbin.org/get
    https://<httpbin.org IP>/get
  expected_results: 호스트명 요청은 막히고(그 요청의 행이 남음), HTTP_HOST가 매칭하지 않는 IP 직접 요청은 통과한다.
  en:
    scenario: A hostname blocked with HTTP_HOST is blocked, and connecting directly to the same destination by IP passes.
    test_steps: |-
      1. Resolve httpbin.org to an IP and create an HTTP_HOST IS [httpbin.org] BLOCK web policy
      2. Confirm that a marked hostname request is blocked and that a policy row for that request itself is recorded
      3. Request the same destination directly by IP and confirm it passes (is delivered) (FAIL if blocked, UNVERIFIED if there is no response)
      4. Leave only evidence of whether SSE sees the IP request, using a LOGGING DESTINATION_IP policy
      5. Delete the policy
    test_parameters: 'Subject: HTTP_HOST, condition: IS, value: [httpbin.org], action: BLOCK'
    test_data: |-
      https://httpbin.org/get
      https://<httpbin.org IP>/get
    expected_results: The hostname request is blocked (a row for that request is recorded), and the direct-IP request, which HTTP_HOST does not match, passes.
BAT-SWG-023:
  test_steps: |-
    1. HTTP_HOST IS [httpbin.org](소문자) BLOCK 웹 정책 생성
    2. curl로 https://HTTPBIN.ORG/get?bat=...-curl 요청(대문자 Host 그대로 전송)
    3. 브라우저로 마커가 다른 같은 주소 방문해 결과 기록(근거로만 남김)
    4. curl이 차단되면 그 요청 자신의 정책 행까지 확인해 PASS, curl이 응답을 받으면 우회 확인(FAIL), curl이 응답을 받지 못하면 UNVERIFIED
    5. 정책 삭제
  test_parameters: 'Subject: HTTP_HOST, condition: IS, value: [httpbin.org], action: BLOCK'
  test_data: https://HTTPBIN.ORG/get
  expected_results: 대문자 Host로 보낸 요청도 차단되고 그 요청의 행이 남는다(curl이 응답을 받으면 FAIL. 단 curl만 통과하고 브라우저는 막히는 증상은 known_issue로 SKIP)
  actual_result: 대문자 Host(HTTPBIN.ORG)로 보낸 curl 요청은 통과했지만 브라우저 요청은 차단됨(호스트를 정규화하지 않는 클라이언트만 비켜 감)
  en:
    scenario: The HTTP_HOST condition matches regardless of case - clients that send the host in uppercase as is (such as curl) must also be blocked.
    test_steps: |-
      1. Create an HTTP_HOST IS [httpbin.org] (lowercase) BLOCK web policy
      2. Request https://HTTPBIN.ORG/get?bat=...-curl with curl (sending the uppercase Host as is)
      3. Visit the same address with a different marker using a browser and record the result (kept only as evidence)
      4. If curl is blocked, PASS after also checking the policy row of that request itself; if curl gets a response, bypass confirmed (FAIL); if curl gets no response, UNVERIFIED
      5. Delete the policy
    test_parameters: 'Subject: HTTP_HOST, condition: IS, value: [httpbin.org], action: BLOCK'
    test_data: https://HTTPBIN.ORG/get
    expected_results: A request sent with an uppercase Host is also blocked and a row for that request is recorded (FAIL if curl gets a response; however, the symptom where only curl passes and the browser is blocked is SKIP via known_issue)
    actual_result: The curl request sent with an uppercase Host (HTTPBIN.ORG) passed but the browser request was blocked (only clients that do not normalize the host get around it)
BAT-X-001:
  test_steps: |-
    1. DLP 키워드 룰 정책 생성
    2. 그 DLP를 참조하는 웹 정책(BLOCK, risk MAJOR) 생성
    3. 토큰 포함 payload 전송해 DLP 단독으로 차단되는지 먼저 확인(사전조건)
    4. 같은 호스트를 대상으로 한 ALLOW 웹 정책을 추가 생성, 우선순위를 BLOCK보다 높게 설정
    5. 같은 토큰 payload를 다시 전송
    6. 보안로그 확인, 전부 삭제
  test_parameters: '우선순위: ALLOW=1, DLP-linked BLOCK=2 (낮은 숫자가 먼저 평가됨)'
  test_data: |-
    DLP keyword rule token
    ALLOW rule: HTTP_HOST IS BLOCK_TARGET_HOST
  expected_results: 우선순위 높은 ALLOW가 있어도 DLP 탐지 차단은 유지된다(차단됨)
  actual_result: 우선순위 높은 ALLOW 정책 때문에 DLP 탐지 payload가 그대로 전달됨(HTTP 200)
  en:
    scenario: Even if there is an ALLOW with higher priority than the web policy triggered by DLP detection, the DLP block is maintained.
    test_steps: |-
      1. Create a DLP keyword rule policy
      2. Create a web policy (BLOCK, risk MAJOR) that references that DLP
      3. Send a payload containing the token and first confirm that DLP alone blocks it (precondition)
      4. Additionally create an ALLOW web policy targeting the same host, with priority set higher than the BLOCK
      5. Send the same token payload again
      6. Check the security log, delete everything
    test_parameters: 'Priority: ALLOW=1, DLP-linked BLOCK=2 (lower number is evaluated first)'
    test_data: |-
      DLP keyword rule token
      ALLOW rule: HTTP_HOST IS BLOCK_TARGET_HOST
    expected_results: The DLP detection block is maintained even with a higher-priority ALLOW (blocked)
    actual_result: Because of the higher-priority ALLOW policy, the DLP-detected payload was delivered as is (HTTP 200)
BAT-X-002:
  test_steps: |-
    1. 정책 전에 example.com이 해석되고 웹 요청이 응답하는지 확인(기준선)
    2. example.com HTTP_HOST ALLOW 웹 정책을 우선순위 1로 두고, example.com FQDN BLOCK DNS Firewall 정책 생성
    3. nslookup 해석 실패와 그 조회의 DNS 정책 행으로 DNS 정책 적용을 확인
    4. 단말 DNS 캐시를 비우고 마커를 단 웹 요청을 보냄
    5. 그 요청이 해석 실패(연결 없음)나 DNS 차단 페이지면 PASS, 전달되면 FAIL, 그 밖의 응답이면 UNVERIFIED
    6. 정책 삭제
  test_parameters: |-
    web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[example.com], priority=1
    dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.condition=IS, rule.value=[example.com]
  test_data: SECOND_HOST=example.com, 정책 이름은 resource_name(case_id, run_id, 'allow'/'dns')으로 실행마다 동적 생성
  expected_results: 같은 호스트를 허용하는 웹 ALLOW가 있어도 실제 웹 요청이 DNS 계층에서 막힌다.
  en:
    scenario: Even if a web policy allowing the same host exists, the DNS Firewall block is maintained.
    test_steps: |-
      1. Before the policies, confirm that example.com resolves and that a web request gets a response (baseline)
      2. Put an example.com HTTP_HOST ALLOW web policy at priority 1, and create an example.com FQDN BLOCK DNS Firewall policy
      3. Confirm the DNS policy is enforced by the nslookup resolution failure and the DNS policy row of that lookup
      4. Flush the endpoint DNS cache and send a marked web request
      5. PASS if that request is a resolution failure (no connection) or a DNS block page, FAIL if it is delivered, UNVERIFIED for any other response
      6. Delete the policies
    test_parameters: |-
      web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[example.com], priority=1
      dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.condition=IS, rule.value=[example.com]
    test_data: SECOND_HOST=example.com, policy names are generated dynamically on each run with resource_name(case_id, run_id, 'allow'/'dns')
    expected_results: Even with a web ALLOW that allows the same host, the actual web request is blocked at the DNS layer.
BAT-X-003:
  test_steps: |-
    1. 정책 전에 example.com이 해석되는지, 그 IP로 붙인 요청이 응답하는지 확인(기준선)
    2. example.com HTTP_HOST ALLOW 웹 정책을 우선순위 1로 두고, 그 IP로 BLOCK Application Firewall 정책 생성
    3. 그 IP로 붙인 요청의 연결 끊김과 dst_ip가 그 IP인 방화벽 정책 행 확인
    4. 정책 삭제
  test_parameters: |-
    web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[example.com], priority=1
    application_firewall: action_type=BLOCK, subject.source.ip_address=[0.0.0.0/0], subject.destination.ip_address=[resolve_ip(example.com)]
  test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, destination_ip은 resolve_ip()로 실행 시점에 동적 확인, 정책 이름은 resource_name()으로 동적 생성
  expected_results: 웹 ALLOW가 있어도 목적지 IP로의 연결이 끊기고 방화벽 정책의 행이 남는다.
  en:
    scenario: Even if a web policy allowing the same host exists, the Application Firewall block is maintained.
    test_steps: |-
      1. Before the policies, confirm that example.com resolves and that a request pinned to that IP gets a response (baseline)
      2. Put an example.com HTTP_HOST ALLOW web policy at priority 1, and create a BLOCK Application Firewall policy for that IP
      3. Confirm the connection drop of the request pinned to that IP and the firewall policy row whose dst_ip is that IP
      4. Delete the policies
    test_parameters: |-
      web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[example.com], priority=1
      application_firewall: action_type=BLOCK, subject.source.ip_address=[0.0.0.0/0], subject.destination.ip_address=[resolve_ip(example.com)]
    test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, destination_ip is determined dynamically at run time with resolve_ip(), policy names are generated dynamically with resource_name()
    expected_results: Even with a web ALLOW, the connection to the destination IP is dropped and a row for the firewall policy is recorded.
BAT-X-005:
  test_steps: |-
    1. 정책 전에 example.com이 해석되는지, 그 IP로 붙인 요청이 응답하는지 확인(기준선)
    2. 그 IP로 BLOCK Application Firewall 정책과 example.com FQDN BLOCK DNS Firewall 정책을 함께 생성
    3. 어느 한 계층이 막는지 확인하고, DNS 정책의 해석 실패와 그 조회의 DNS 행 확인
    4. DNS 정책 삭제(목록에서 사라졌는지 확인) 후 이름이 다시 해석되는지 확인(삭제 반영, 막혀 있으면 FAIL)
    5. 그 IP로 붙인 요청이 여전히 끊기고 방화벽 정책의 새 행(dst_ip)이 남는지 확인
    6. 방화벽 정책 삭제
  test_parameters: |-
    application_firewall: action_type=BLOCK, subject.source.ip_address=[0.0.0.0/0], subject.destination.ip_address=[resolve_ip(example.com)]
    dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.value=[example.com]
  test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, destination_ip은 resolve_ip()로 동적 확인, 정책 이름은 resource_name()으로 동적 생성
  expected_results: DNS 정책을 지우면 이름은 다시 해석되지만 방화벽 정책의 차단은 그대로 유지되고 그 행이 남는다.
  en:
    scenario: When two layers are blocking together, deleting one still leaves the other's block intact.
    test_steps: |-
      1. Before the policies, confirm that example.com resolves and that a request pinned to that IP gets a response (baseline)
      2. Create together a BLOCK Application Firewall policy for that IP and an example.com FQDN BLOCK DNS Firewall policy
      3. Confirm that one of the layers blocks, and check the DNS policy's resolution failure and the DNS row of that lookup
      4. Delete the DNS policy (confirm it has disappeared from the list), then confirm the name resolves again (deletion applied; FAIL if still blocked)
      5. Confirm that a request pinned to that IP is still dropped and that a new firewall policy row (dst_ip) is recorded
      6. Delete the firewall policy
    test_parameters: |-
      application_firewall: action_type=BLOCK, subject.source.ip_address=[0.0.0.0/0], subject.destination.ip_address=[resolve_ip(example.com)]
      dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.value=[example.com]
    test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, destination_ip is determined dynamically with resolve_ip(), policy names are generated dynamically with resource_name()
    expected_results: After the DNS policy is deleted the name resolves again, but the firewall policy's block remains in effect and its row is recorded.
BAT-X-006:
  test_steps: |-
    1. CASB SaaS Access BLOCK 정책(application=[CASB_SAAS_APP_ID], risk_level=Major)을 생성해 Notion 앱을 차단한다.
    2. 그 안에서 같은 CASB_SAAS_HOST(www.notion.so)를 허용하는 HTTP_HOST ALLOW 웹정책을 생성하고 우선순위를 1(최우선)로 설정한다.
    3. 실제 브라우저(Playwright)로 CASB_SAAS_URL을 방문해 차단 페이지 여부를 기록한다(화면 결과는 기록만, 단언하지 않음 — CASB 차단은 간헐적이므로).
    4. casb_log(casb_security_log)에서 CASB 정책명으로 이벤트를 폴링하고 in_app_service가 CASB_SAAS_APP_NAME(Notion)인지 확인한다.
    5. 이벤트의 action 필드가 'BLOCK'인지 확인한다(우선순위 높은 웹 ALLOW가 CASB 판정을 무력화하지 않았는지가 핵심 단언).
    6. 두 정책을 정리(삭제)한다.
  test_parameters: |-
    saas_access: action_type=BLOCK, risk_level=Major, application=[CASB_SAAS_APP_ID]
    web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[www.notion.so], priority=1
  test_data: CASB_SAAS_APP_ID=3(Notion), CASB_SAAS_APP_NAME='Notion', CASB_SAAS_HOST='www.notion.so', CASB_SAAS_URL='https://www.notion.so/', 정책 이름은 resource_name()으로 동적 생성
  expected_results: 같은 호스트를 허용하는 우선순위 1의 웹 ALLOW 정책이 있어도 casb_security_log에 기록된 이벤트의 action은 BLOCK이어야 한다(화면 차단 여부는 판정에 쓰지 않음).
  en:
    scenario: The CASB app block is maintained even if a higher-priority web policy allowing the same host exists.
    test_steps: |-
      1. Create a CASB SaaS Access BLOCK policy (application=[CASB_SAAS_APP_ID], risk_level=Major) to block the Notion app.
      2. Alongside it, create an HTTP_HOST ALLOW web policy that allows the same CASB_SAAS_HOST (www.notion.so) and set its priority to 1 (highest).
      3. Visit CASB_SAAS_URL with a real browser (Playwright) and record whether a block page appears (the screen result is only recorded, not asserted - because CASB blocking is intermittent).
      4. Poll casb_log (casb_security_log) for an event by the CASB policy name and confirm that in_app_service is CASB_SAAS_APP_NAME (Notion).
      5. Confirm that the action field of the event is 'BLOCK' (the key assertion is that the higher-priority web ALLOW did not nullify the CASB verdict).
      6. Clean up (delete) the two policies.
    test_parameters: |-
      saas_access: action_type=BLOCK, risk_level=Major, application=[CASB_SAAS_APP_ID]
      web_policy: action_type=ALLOW, subject=HTTP_HOST, condition=IS, value=[www.notion.so], priority=1
    test_data: CASB_SAAS_APP_ID=3 (Notion), CASB_SAAS_APP_NAME='Notion', CASB_SAAS_HOST='www.notion.so', CASB_SAAS_URL='https://www.notion.so/', policy names are generated dynamically with resource_name()
    expected_results: Even with a priority-1 web ALLOW policy that allows the same host, the action of the event recorded in casb_security_log must be BLOCK (whether the screen is blocked is not used for the verdict).
BAT-X-007:
  test_steps: |-
    1. 정책 전에 example.com이 해석되는지 확인(기준선)
    2. example.com에 LOGGING 웹 정책(대조)을 걸고, 마커를 단 요청이 그 정책으로 웹 로그에 찍히는지 확인(양성 대조, 안 찍히면 UNVERIFIED)
    3. example.com FQDN BLOCK DNS Firewall 정책 생성, 해석 실패와 그 조회의 DNS 행 확인
    4. 단말 DNS 캐시를 비우고 마커를 단 요청을 보냄(결과는 근거로 기록)
    5. 실제 IP로 붙인 표지 요청의 행이 대조 정책으로 나타난 뒤, DNS로 막힌 요청의 웹 로그 행이 어느 정책으로도 없는지 확인
    6. 정책 삭제
  test_parameters: 'dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.condition=IS, rule.value=[example.com]'
  test_data: SECOND_HOST=example.com, 정책 이름은 resource_name(case_id, run_id)로 동적 생성
  expected_results: DNS로 막힌 요청은 DNS 보안로그에만 남고 웹 보안로그에는 어떤 행도 남지 않는다.
  en:
    scenario: A request blocked by the DNS Firewall is recorded only in the DNS security log and not in the web security log.
    test_steps: |-
      1. Before the policies, confirm that example.com resolves (baseline)
      2. Apply a LOGGING web policy (control) to example.com and confirm that a marked request is logged in the web log under that policy (positive control; UNVERIFIED if it is not logged)
      3. Create an example.com FQDN BLOCK DNS Firewall policy, and check the resolution failure and the DNS row of that lookup
      4. Flush the endpoint DNS cache and send a marked request (record the result as evidence)
      5. After the row of a sentinel request pinned to the real IP appears under the control policy, confirm that the web log row of the DNS-blocked request does not exist under any policy
      6. Delete the policies
    test_parameters: 'dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.condition=IS, rule.value=[example.com]'
    test_data: SECOND_HOST=example.com, policy names are generated dynamically with resource_name(case_id, run_id)
    expected_results: A request blocked by DNS is recorded only in the DNS security log and no row is left in the web security log.
BAT-X-008:
  test_steps: |-
    1. SECOND_HOST가 정상 해석될 때까지 대기한다.
    2. 'bat-token' 키워드 룰(DLP 고유 토큰 포함)을 가진 DLP 정책을 생성한다.
    3. 그 DLP 정책을 참조하는 DLP_POLICY rule의 웹 BLOCK 정책(risk_level=MAJOR)을 생성한다.
    4. 토큰이 포함된 POST 페이로드로 SECOND_URL에 curl 요청을 보내, DLP 단독으로 403 차단 페이지가 뜨는지 먼저 확인한다(선행 검증).
    5. 같은 SECOND_HOST를 막는 DNS Firewall BLOCK 정책을 추가로 생성한다(DLP와 DNS 두 계층이 동시에 걸린 상태).
    6. nslookup으로 SECOND_HOST 조회가 차단되는지, 그 DNS 정책의 이벤트가 남는지 확인한다.
    7. 단말 DNS 캐시를 비운 뒤(ipconfig /flushdns) 마커를 단 SECOND_URL로 토큰 포함 POST를 보내 통과하지 않는지 확인한다.
    8. 그 요청 뒤에 DNS Firewall 정책의 새 행이 생겼는지 확인한다(없으면 FAIL: DNS 계층에서 막히지 않음).
    9. 표지 요청: 토큰 포함 POST를 마커를 단 httpbin.org/post로 보내 그 DLP 행이 나타난 다음, 7번 요청의 마커가 든 DLP 웹정책 행이 없는지 확인한다(있으면 FAIL: DLP 검사까지 감).
    10. 두 정책(DLP 연결 웹 정책, DNS Firewall 정책)과 DLP 정책을 정리(삭제)한다.
  test_parameters: |-
    dlp_policy: rule=keyword_rule('bat-token', [token])
    web_policy: action_type=BLOCK, risk_level=MAJOR, rule=DLP_POLICY rule(dlp_policy_id)
    dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.value=[example.com]
    traffic: method=POST, data=keyword_payload(token)
  test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, token=marker(case_id, run_id)로 동적 생성된 'BATSENSITIVE...' 문자열, payload='note=quarterly review&secret=<token>&owner=bat-suite'
  expected_results: DLP 연결 웹 정책과 DNS Firewall 정책이 동시에 걸려 있을 때 토큰이 포함된 요청은 통과하지 않고, 그 요청은 DNS Firewall 행을 새로 남기며 DLP 웹정책 행은 남기지 않는다(DNS 계층에서 먼저 막힘).
  en:
    scenario: When the DNS Firewall blocks, the request never even reaches the DLP inspection stage.
    test_steps: |-
      1. Wait until SECOND_HOST resolves normally.
      2. Create a DLP policy with a 'bat-token' keyword rule (containing a DLP-unique token).
      3. Create a web BLOCK policy (risk_level=MAJOR) with a DLP_POLICY rule that references that DLP policy.
      4. Send a curl request to SECOND_URL with a POST payload containing the token and first confirm that DLP alone produces a 403 block page (prerequisite check).
      5. Additionally create a DNS Firewall BLOCK policy that blocks the same SECOND_HOST (state where the DLP and DNS layers are applied at the same time).
      6. Confirm with nslookup that the SECOND_HOST lookup is blocked and that an event for that DNS policy is recorded.
      7. After flushing the endpoint DNS cache (ipconfig /flushdns), send a POST containing the token to a marked SECOND_URL and confirm that it does not pass.
      8. Confirm that a new row for the DNS Firewall policy appeared after that request (FAIL if not: it was not blocked at the DNS layer).
      9. Sentinel request: send a POST containing the token to a marked httpbin.org/post, and after its DLP row appears, confirm that there is no DLP web policy row containing the marker of the request in step 7 (FAIL if there is: it reached DLP inspection).
      10. Clean up (delete) the two policies (DLP-linked web policy, DNS Firewall policy) and the DLP policy.
    test_parameters: |-
      dlp_policy: rule=keyword_rule('bat-token', [token])
      web_policy: action_type=BLOCK, risk_level=MAJOR, rule=DLP_POLICY rule(dlp_policy_id)
      dns_firewall: action_type=BLOCK, rule.subject=FQDN, rule.value=[example.com]
      traffic: method=POST, data=keyword_payload(token)
    test_data: SECOND_HOST=example.com, SECOND_URL=https://example.com/, token = a 'BATSENSITIVE...' string generated dynamically with marker(case_id, run_id), payload='note=quarterly review&secret=<token>&owner=bat-suite'
    expected_results: When the DLP-linked web policy and the DNS Firewall policy are applied at the same time, a request containing the token does not pass, and that request leaves a new DNS Firewall row and no DLP web policy row (blocked first at the DNS layer).
BAT-X-009:
  test_steps: |-
    1. HTTP_HOST가 chatgpt.com인 BLOCK 웹정책을 생성한다.
    2. 실제 브라우저로 https://chatgpt.com/ 을 방문해 차단 페이지가 뜰 때까지 재시도한다.
    3. 차단 페이지가 표시되는지 확인한다(GenAI 전용 정책이 아니라 웹 계층 호스트 차단으로 막혔는지가 핵심).
    4. web_log에서 정책명과 대상(chatgpt.com, target_in_search=True)으로 이벤트를 폴링해 확인한다.
    5. 정책을 정리(삭제)한다.
  test_parameters: 'web_policy: action_type=BLOCK, subject=HTTP_HOST, condition=IS, value=[chatgpt.com]'
  test_data: host='chatgpt.com', 정책 이름은 resource_name(case_id, run_id)로 동적 생성
  expected_results: GenAI 프롬프트/페이지 차단이 이 환경에서 동작하지 않더라도, chatgpt.com을 막는 웹정책만으로 실제 페이지 로딩이 차단 페이지로 끝나고 웹 보안 로그에 해당 호스트를 대상으로 한 이벤트가 남아야 한다.
  en:
    scenario: An AI service that the GenAI policy cannot block is still blocked by a web policy host block.
    test_steps: |-
      1. Create a BLOCK web policy with HTTP_HOST chatgpt.com.
      2. Visit https://chatgpt.com/ with a real browser, retrying until the block page appears.
      3. Confirm the block page is displayed (the key point is that it was blocked by the web-layer host block, not by a GenAI-specific policy).
      4. Poll web_log for an event by policy name and target (chatgpt.com, target_in_search=True) and confirm it.
      5. Clean up (delete) the policy.
    test_parameters: 'web_policy: action_type=BLOCK, subject=HTTP_HOST, condition=IS, value=[chatgpt.com]'
    test_data: host='chatgpt.com', the policy name is generated dynamically with resource_name(case_id, run_id)
    expected_results: Even if GenAI prompt/page blocking does not work in this environment, a web policy that blocks chatgpt.com alone must end the real page load in a block page and leave an event targeting that host in the web security log.
BAT-X-010:
  test_steps: |-
    1. GenAI 대상 앱(chatgpt)이 카탈로그에 있는지 확인한다(없으면 BAT_ERROR).
    2. (평범한 하루) ALLOW_TARGET_URL(https://www.iana.org/)을 브라우저로 방문해 아무것도 막혀 있지 않음을 확인한다.
    3. (민감정보 업로드) 'bat-token' 키워드 룰의 DLP 정책과, 이를 참조하는 DLP_POLICY 웹 BLOCK 정책(risk_level=MAJOR)을 생성한다.
    4. 토큰이 포함된 POST 페이로드로 POST_TARGET_URL(https://httpbin.org/post)에 curl 요청을 보내 차단되는지 확인한다.
    5. web_log에서 DLP 연결 웹 정책명의 이벤트를 폴링해 확인한다.
    6. (위험 SaaS 접속) CASB SaaS Access BLOCK 정책(application=[CASB_SAAS_APP_ID])을 생성하고 브라우저로 CASB_SAAS_URL(Notion)을 방문한다(화면 결과는 기록만).
    7. casb_log에서 CASB 정책명·Notion 이벤트를 폴링해 확인한다.
    8. (GenAI 사용) 참조 앱 id로 GenAI BLOCK 정책을 생성하고, 목록을 다시 읽어 동작(BLOCK)·토픽(all)·대상 앱이 요청값과 같은지 비교한다(프롬프트 차단 자체는 로그인 필요로 검증 불가).
    9. 각 단계의 정책(DLP, DLP 연결 웹정책, CASB, GenAI)을 모두 정리(삭제)한다.
  test_parameters: |-
    baseline: ALLOW_TARGET_URL=https://www.iana.org/
    dlp: rule=keyword_rule('bat-token', [token]) + web BLOCK(risk_level=MAJOR, DLP_POLICY rule), traffic=POST to POST_TARGET_URL
    casb: saas_access BLOCK, application=[CASB_SAAS_APP_ID], risk_level=Major, 방문 URL=CASB_SAAS_URL
    genai: action_type=BLOCK, application=[genai_app.id](chatgpt)
  test_data: token=marker(case_id, run_id)로 동적 생성, payload='note=quarterly review&secret=<token>&owner=bat-suite', CASB_SAAS_APP_ID=3(Notion), GENAI_TARGET_APP='chatgpt', 정책 이름들은 resource_name()으로 동적 생성
  expected_results: 같은 세션 안에서 순서대로 걸은 평범한 방문→DLP→CASB→GenAI 네 단계가 서로 방해하지 않고, 평범한 방문은 통과하고 DLP는 차단+이벤트 기록, CASB는 이벤트 기록(Notion), GenAI 정책은 생성 후 목록에 정상 조회되어야 한다.
  en:
    scenario: While browsing normally, uploading sensitive data, visiting a risky SaaS app and using GenAI are each caught in turn.
    test_steps: |-
      1. Confirm the GenAI target app (chatgpt) is in the catalog (BAT_ERROR if not).
      2. (Ordinary day) Visit ALLOW_TARGET_URL (https://www.iana.org/) with the browser and confirm nothing is blocked.
      3. (Sensitive data upload) Create a DLP policy with a 'bat-token' keyword rule and a DLP_POLICY web BLOCK policy that references it (risk_level=MAJOR).
      4. Send a curl request to POST_TARGET_URL (https://httpbin.org/post) with a POST payload containing the token and confirm it is blocked.
      5. Poll web_log for an event of the DLP-linked web policy name and confirm it.
      6. (Risky SaaS access) Create a CASB SaaS Access BLOCK policy (application=[CASB_SAAS_APP_ID]) and visit CASB_SAAS_URL (Notion) with the browser (the screen result is only recorded).
      7. Poll casb_log for the CASB policy name and a Notion event and confirm it.
      8. (GenAI use) Create a GenAI BLOCK policy with the reference app id, re-read the list, and compare that the action (BLOCK), topic (all) and target app equal the requested values (prompt blocking itself cannot be verified because it requires login).
      9. Clean up (delete) the policy of every step (DLP, DLP-linked web policy, CASB, GenAI).
    test_parameters: |-
      baseline: ALLOW_TARGET_URL=https://www.iana.org/
      dlp: rule=keyword_rule('bat-token', [token]) + web BLOCK(risk_level=MAJOR, DLP_POLICY rule), traffic=POST to POST_TARGET_URL
      casb: saas_access BLOCK, application=[CASB_SAAS_APP_ID], risk_level=Major, visited URL=CASB_SAAS_URL
      genai: action_type=BLOCK, application=[genai_app.id](chatgpt)
    test_data: token is generated dynamically with marker(case_id, run_id), payload='note=quarterly review&secret=<token>&owner=bat-suite', CASB_SAAS_APP_ID=3(Notion), GENAI_TARGET_APP='chatgpt', policy names are generated dynamically with resource_name()
    expected_results: 'The four steps walked in order within the same session (ordinary visit, DLP, CASB, GenAI) must not interfere with each other: the ordinary visit passes, DLP blocks and records an event, CASB records an event (Notion), and the GenAI policy is created and read back normally from the list.'
BAT-X-011:
  test_steps: |-
    1. DLP 키워드 룰을 연결한 웹 BLOCK 정책과 Notion SaaS Access BLOCK 정책을 함께 생성
    2. 채널 A: 마커를 단 DLP 키워드 POST가 차단되고 그 요청 자신의 DLP 정책 행이 남는지 확인
    3. 채널 B: Notion 방문을 BAT-CASB-004와 같은 방식(전파 예산, 그 뒤 5번 차단, 요청마다 자기 BLOCK 행)으로 판정
    4. 교차 음성 대조 1: 그 뒤 CASB 요청들의 행이 들어온 시점에 DLP 업로드 요청의 행이 CASB 로그에 없는지 확인
    5. 교차 음성 대조 2: DLP 표지 요청의 행이 나타난 뒤 CASB 방문 요청들의 행이 DLP 웹 정책으로 없는지 확인
    6. 정책 삭제
  test_parameters: |-
    dlp: rule=keyword_rule('bat-token', [token]) + web BLOCK(risk_level=MAJOR, DLP_POLICY rule), traffic=POST to POST_TARGET_URL
    casb: saas_access BLOCK, application=[CASB_SAAS_APP_ID], risk_level=Major, 방문 URL=CASB_SAAS_URL
    검증: dlp_event.policy_name != casb_name AND casb_event.rule_name != dlp_block_name
  test_data: token=marker(case_id, run_id)로 동적 생성, payload='note=quarterly review&secret=<token>&owner=bat-suite', CASB_SAAS_APP_ID=3(Notion), 정책 이름은 resource_name()으로 동적 생성
  expected_results: 두 차단 채널이 동시에 켜져 있어도 각자 자기 요청만 막고 기록하며, 상대 채널의 요청은 자기 로그에 남기지 않는다.
  en:
    scenario: Even when DLP and CASB blocks are set at the same time after suspicious activity, each blocks only its own traffic accurately.
    test_steps: |-
      1. Create together a web BLOCK policy linked to a DLP keyword rule and a Notion SaaS Access BLOCK policy
      2. Channel A: confirm the DLP keyword POST carrying a marker is blocked and that request's own DLP policy row is left
      3. Channel B: judge the Notion visit the same way as BAT-CASB-004 (propagation budget, then 5 blocks, each request's own BLOCK row)
      4. Cross negative control 1: confirm that, by the time the rows of the later CASB requests have arrived, the row of the DLP upload request is not in the CASB log
      5. Cross negative control 2: confirm that, after the row of the DLP marker request appears, the rows of the CASB visit requests are not attributed to the DLP web policy
      6. Delete the policies
    test_parameters: |-
      dlp: rule=keyword_rule('bat-token', [token]) + web BLOCK(risk_level=MAJOR, DLP_POLICY rule), traffic=POST to POST_TARGET_URL
      casb: saas_access BLOCK, application=[CASB_SAAS_APP_ID], risk_level=Major, visited URL=CASB_SAAS_URL
      verification: dlp_event.policy_name != casb_name AND casb_event.rule_name != dlp_block_name
    test_data: token is generated dynamically with marker(case_id, run_id), payload='note=quarterly review&secret=<token>&owner=bat-suite', CASB_SAAS_APP_ID=3(Notion), policy names are generated dynamically with resource_name()
    expected_results: Even with both block channels on at the same time, each blocks and records only its own requests, and does not leave the other channel's requests in its own log.
BAT-ZTNA-001:
  test_steps: |-
    1. 커넥터 프로세스가 실행 중인지 확인
    2. 이 단말의 device_id(설정값 또는 하드웨어 UUID)로 인증 로그 조회. 이 단말의 행이 나올 때까지 1일 → 7일 → 30일로 범위를 넓힘(서버가 넓힌 조회를 거부하면 거기서 멈추고 근거로 기록)
    3. 이 단말의 가장 최근 행이 연결 해제(AUTH_DISCONNECT_*)면 FAIL
    4. 로그인 또는 터널 연결 행이 있으면 PASS(범위를 다 넓혀도 없으면 UNVERIFIED). 그 행이 며칠 전인지, 이번 실행 전인지는 근거로 기록
  test_parameters: |-
    process_name: AIConnector for Client
    lookback: 1일, 7일, 30일 순서(행이 한 페이지보다 많으면 마지막 페이지도 읽음)
    identity fields: user, device, src_ip, result, os
  test_data: CONNECTOR_PROCESS 상수 "AIConnector for Client", AUTH_LOOKBACK_DAYS=(1, 7, 30), identity 값은 auth_log에서 실시간으로 조회되는 최신 인증 이벤트(고정 리터럴 아님)
  expected_results: 커넥터가 실행 중이고, 이 단말의 가장 최근 인증 기록이 연결 해제가 아니며 로그인·터널 연결 행이 남아 있다.
  en:
    scenario: The connector is connected, and its authentication is recorded in the audit log.
    test_steps: |-
      1. Confirm the connector process is running
      2. Query the auth log by this endpoint's device_id (the configured value or the hardware UUID). Widen the range 1 day -> 7 days -> 30 days until a row of this endpoint appears (if the server rejects the widened query, stop there and record it as evidence)
      3. FAIL if this endpoint's most recent row is a disconnect (AUTH_DISCONNECT_*)
      4. PASS if there is a login or tunnel connect row (UNVERIFIED if there is none even after widening the whole range). Record as evidence how many days ago that row is and whether it is before this run
    test_parameters: |-
      process_name: AIConnector for Client
      lookback: in the order 1 day, 7 days, 30 days (if there are more rows than one page, the last page is also read)
      identity fields: user, device, src_ip, result, os
    test_data: CONNECTOR_PROCESS constant "AIConnector for Client", AUTH_LOOKBACK_DAYS=(1, 7, 30), identity values are the latest authentication event looked up live from auth_log (not fixed literals)
    expected_results: The connector is running, this endpoint's most recent authentication record is not a disconnect, and login or tunnel connect rows remain.
BAT-ZTNA-002:
  test_steps: |-
    1. country AQ rule로 BLOCK 접근 정책 생성, 다시 읽어 action_type과 국가(AQ)가 요청값과 같은지 비교
    2. 삭제 후 목록에서 사라졌는지 확인
    3. ALLOW로 같은 절차 반복
  test_parameters: |-
    action_type: BLOCK
    rule: {country: ["AQ"]}
    검증 대상: 생성 직후 list() 포함 여부, 삭제 후 list() 미포함 여부
  test_data: 'policy_name은 resource_name("BAT-ZTNA-005", run_id)으로 동적 생성, rule={"country": ["AQ"]}'
  expected_results: BLOCK·ALLOW 접근 정책이 각각 요청한 동작·국가로 저장되고, 삭제하면 사라진다.
  en:
    scenario: When a ZTNA access policy is created as BLOCK and as ALLOW, each is stored as requested, and it disappears when deleted.
    test_steps: |-
      1. Create a BLOCK access policy with a country AQ rule, re-read it, and compare that action_type and country (AQ) equal the requested values
      2. After deletion, confirm it has disappeared from the list
      3. Repeat the same procedure with ALLOW
    test_parameters: |-
      action_type: BLOCK
      rule: {country: ["AQ"]}
      verification target: inclusion in list() right after creation, exclusion from list() after deletion
    test_data: 'policy_name is generated dynamically with resource_name("BAT-ZTNA-005", run_id), rule={"country": ["AQ"]}'
    expected_results: The BLOCK and ALLOW access policies are each stored with the requested action and country, and disappear when deleted.
BAT-ZTNA-003:
  test_steps: |-
    1. 인증 로그에서 디렉터리 실사용자 id를 찾음
    2. 그 사용자 id와 country AQ rule로 BLOCK 접근 정책 생성
    3. 다시 읽어 action_type(BLOCK), rule의 사용자 id, 국가(AQ)가 요청값과 같은지 비교
    4. 정책 삭제
  test_parameters: |-
    action_type: BLOCK
    rule: {user_id: [실제 auth_log에서 얻은 user_id], country: ["AQ"]}
    검증 대상: list() 결과에 정책명 포함 여부
  test_data: user_id는 auth_log 최신 인증 이벤트(또는 사용자 디렉터리 역질의)에서 동적으로 얻은 실제 값, country=["AQ"] 고정, policy_name은 resource_name("BAT-ZTNA-006", run_id)으로 동적 생성
  expected_results: 실사용자를 대상으로 한 접근 정책이 요청한 사용자·국가·동작으로 저장된다.
  en:
    scenario: An access policy targeting a real connector user is created normally.
    test_steps: |-
      1. Find a real directory user id in the auth log
      2. Create a BLOCK access policy with that user id and a country AQ rule
      3. Re-read it and compare that action_type (BLOCK), the user id in the rule, and the country (AQ) equal the requested values
      4. Delete the policy
    test_parameters: |-
      action_type: BLOCK
      rule: {user_id: [user_id obtained from the real auth_log], country: ["AQ"]}
      verification target: whether the policy name is included in the list() result
    test_data: user_id is the real value obtained dynamically from the latest auth_log authentication event (or a reverse lookup of the user directory), country=["AQ"] fixed, policy_name is generated dynamically with resource_name("BAT-ZTNA-006", run_id)
    expected_results: The access policy targeting a real user is stored with the requested user, country and action.
