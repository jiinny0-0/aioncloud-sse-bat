# 케이스 설명: 결과 엑셀(reports/result/)의 Test Steps, Test Parameters, Test Data,
# Expected Results, Actual Result 열을 채운다.
# actual_result는 PASS가 아닐 때 쓰는 한글 설명이다. PASS면 expected_results를 그대로 쓴다.
# 새 케이스를 추가하면 여기에도 항목을 추가한다(selfcheck가 확인한다).
# en: 아래에는 BAT_REPORT_LANG=en일 때 쓰는 영어판을 같은 키로 둔다. scenario는 영어판에만
# 있다(한국어는 테스트 docstring 첫 줄). 한국어를 고치면 en도 같이 고친다. 빠진 키는 한국어로
# 대체되고 결과 CSV를 쓸 때 경고가 남는다(selfcheck가 누락을 확인한다).
# 단계의 "FAIL"은 기대와 다르다는 뜻이다. 최종 상태는 판정 체계가 정한다: gate 케이스(Priority P0)만
# FAIL이 될 수 있고, 그 밖의 케이스·일부 대상만 실패·이벤트만 실패·재확인 PASS는 WARN이다.

BAT-BASIC-001:
  test_steps: |-
    1. Open API 토큰이 설정된 REST 클라이언트로 GET /sia/v1/user/group/list 요청
    2. 응답 payload가 dict(JSON 객체) 타입인지 확인
    3. 결과를 기록하고 케이스 PASS 처리
  test_parameters: |-
    Endpoint: GET /sia/v1/user/group/list
    Params: offset=1, limit=1
  test_data: 'offset: 1, limit: 1 (고정 리터럴, rest.get 호출 params)'
  expected_results: API 응답이 dict 형태의 JSON 객체여야 하며, 이는 요청이 실제로 API까지 도달해 정상 처리되었음을 의미한다.
  en:
    scenario: A request authenticated with an Open API token is processed normally.
    test_steps: |-
      1. Send GET /sia/v1/user/group/list with a REST client that has the Open API token configured
      2. Check that the response payload is a dict (JSON object)
      3. Record the result and mark the case PASS
    test_parameters: |-
      Endpoint: GET /sia/v1/user/group/list
      Params: offset=1, limit=1
    test_data: 'offset: 1, limit: 1 (fixed literals, params of the rest.get call)'
    expected_results: The API response must be a JSON object (dict), which means the request actually reached the API and was processed normally.
BAT-BASIC-002:
  test_steps: |-
    1. case_id와 run_id를 조합해 정책 이름 생성(resource_name)
    2. Subject=HTTP_HOST, Condition=IS, value=[BLOCK_TARGET_HOST] rule 생성
    3. web_policies.temporary()로 action_type=BLOCK인 웹 정책을 임시 생성
    4. 생성된 policy_id를 case.policy_ids에 기록
    5. web_policies.get()으로 생성한 정책을 재조회
    6. 조회된 name/action_type/enable이 요청한 값과 일치하는지 비교(다르면 WARN)
    7. with 블록 종료 시 정책 자동 삭제(temporary 컨텍스트)
    8. 생성이나 재조회 자체가 API에서 거부되면 FAIL(관리 불가), 401/403은 BAT_ERROR
  test_parameters: |-
    Subject: HTTP_HOST
    Condition: IS
    Action Type: BLOCK
    Value: BLOCK_TARGET_HOST
  test_data: 'policy_name: 동적 생성(resource_name(case_id, run_id) 조합, 예 BAT-BASIC-002-<run_id>), rule value: ["httpbin.org"](BLOCK_TARGET_HOST), action_type: BLOCK'
  expected_results: 생성 요청 직후 재조회한 정책의 name, action_type(BLOCK), enable(true)이 요청한 값과 정확히 일치해야 한다.
  en:
    scenario: When a policy is created, the stored content is read back exactly as requested.
    test_steps: |-
      1. Build the policy name from case_id and run_id (resource_name)
      2. Create a rule with Subject=HTTP_HOST, Condition=IS, value=[BLOCK_TARGET_HOST]
      3. Temporarily create a web policy with action_type=BLOCK via web_policies.temporary()
      4. Record the created policy_id in case.policy_ids
      5. Re-read the created policy with web_policies.get()
      6. Compare the read name/action_type/enable with the requested values (WARN if they differ)
      7. The policy is deleted automatically when the with block ends (temporary context)
      8. FAIL (management broken) if the API rejects the creation or the read-back itself; 401/403 is BAT_ERROR
    test_parameters: |-
      Subject: HTTP_HOST
      Condition: IS
      Action Type: BLOCK
      Value: BLOCK_TARGET_HOST
    test_data: 'policy_name: generated dynamically (combination of resource_name(case_id, run_id), e.g. BAT-BASIC-002-<run_id>), rule value: ["httpbin.org"] (BLOCK_TARGET_HOST), action_type: BLOCK'
    expected_results: The name, action_type (BLOCK) and enable (true) of the policy re-read right after the create request must match the requested values exactly.
BAT-BASIC-003:
  test_steps: |-
    1. web_log.security_events(lookback_min=1440)으로 최근 24시간 보안 이벤트 조회
    2. 이벤트가 0건이면 실행 조건 미비로 BAT_ERROR 처리(트래픽 부재로 스키마 검증 불가)
    3. 가장 최신 이벤트(raw)에서 필수 필드(id, time, policy_name, action) 존재 여부 확인
    4. 누락 필드가 없는지 검증
  test_parameters: |-
    Lookback: 24시간(1440분)
    Required fields: id, time, policy_name, action
  test_data: lookback_min=1440 (고정 리터럴), required 필드 튜플 ("id", "time", "policy_name", "action")
  expected_results: 최근 24시간 내 보안 이벤트가 조회되고, 가장 최신 이벤트에 id/time/policy_name/action 필드가 모두 포함되어야 한다.
  en:
    scenario: The security log API can be queried and contains the required fields.
    test_steps: |-
      1. Query security events of the last 24 hours with web_log.security_events(lookback_min=1440)
      2. If there are 0 events, treat it as an unmet execution condition and mark BAT_ERROR (the schema cannot be verified without traffic)
      3. Check that the required fields (id, time, policy_name, action) exist in the latest event (raw)
      4. Verify that no field is missing
    test_parameters: |-
      Lookback: 24 hours (1440 minutes)
      Required fields: id, time, policy_name, action
    test_data: lookback_min=1440 (fixed literal), required field tuple ("id", "time", "policy_name", "action")
    expected_results: Security events within the last 24 hours are returned, and the latest event must contain all of the id/time/policy_name/action fields.
BAT-BASIC-004:
  test_steps: |-
    1. 커넥터 프로세스가 실행 중인지 확인
    2. ALLOW_TARGET_URL 호스트(www.iana.org)에 HTTP_HOST LOGGING 정책을 만든다
    3. 단말 브라우저로 마커를 단 ALLOW_TARGET_URL을 전파 시간 동안 되풀이해 방문한다
    4. 그 마커가 든 행이 이 정책 id로 보안 로그에 찍히는지 확인한다(이 단말의 트래픽이 SSE를 지난다는 근거). 행의 device_id·사용자·출발지 IP는 근거로 남긴다
    5. 정책 삭제
  test_parameters: |-
    Connector process: AIConnector for Client
    Target URL: ALLOW_TARGET_URL
    Lookback: 24시간(1440분)
  test_data: ALLOW_TARGET_URL = "https://www.iana.org/"
  expected_results: 커넥터 프로세스가 실행 중이고, 단말이 보낸 마커 요청이 LOGGING 정책의 보안 로그 행으로 찍힌다(트래픽이 실제로 SSE를 경유).
  en:
    scenario: Traffic from the test endpoint actually passes through SSE.
    test_steps: |-
      1. Check that the connector process is running
      2. Create an HTTP_HOST LOGGING policy for the ALLOW_TARGET_URL host (www.iana.org)
      3. Repeatedly visit the marked ALLOW_TARGET_URL with the endpoint browser for the propagation time
      4. Check that a row containing that marker appears in the security log with this policy id (evidence that this endpoint's traffic passes through SSE). The row's device_id, user and source IP are kept as evidence
      5. Delete the policy
    test_parameters: |-
      Connector process: AIConnector for Client
      Target URL: ALLOW_TARGET_URL
      Lookback: 24 hours (1440 minutes)
    test_data: ALLOW_TARGET_URL = "https://www.iana.org/"
    expected_results: The connector process is running, and the marked request sent by the endpoint appears as a security log row of the LOGGING policy (traffic actually passes through SSE).
BAT-BASIC-005:
  test_steps: |-
    1. 웹, DLP, GenAI, CASB 두 종류, RBI, DNS/Application Firewall, ZTNA 접근제어·터널·접근정책 목록을 모두 읽음(웹·DLP는 total로 전체를 읽었는지 확인)
    2. 이번 실행이 아닌 BAT 리소스가 있으면 FAIL
    3. 남은 것은 없지만 읽지 못한 목록이 있으면 UNVERIFIED
  test_parameters: |-
    목록: 웹(GET /sia/v1/web/policy/list, limit 500), DLP(GET /sia/v1/dlp/policy, limit 100), GraphQL 정책 목록 9종
    Filter: BAT 이름 규칙이면서 이번 실행(run_id)이 아닌 것(GenAI는 description의 이름)
  test_data: 이번 실행의 run_id(같은 실행의 리소스는 제외)
  expected_results: 이전 실행이 남긴 BAT 리소스가 어떤 정책 종류에도 없다.
  en:
    scenario: No BAT resources are left over from previous runs.
    test_steps: |-
      1. Read all lists: web, DLP, GenAI, two kinds of CASB, RBI, DNS/Application Firewall, ZTNA access control, tunnel and access policy (for web and DLP, confirm from total that the whole list was read)
      2. FAIL if there is any BAT resource that is not from this run
      3. UNVERIFIED if nothing is left over but some list could not be read
    test_parameters: |-
      Lists: web (GET /sia/v1/web/policy/list, limit 500), DLP (GET /sia/v1/dlp/policy, limit 100), 9 kinds of GraphQL policy lists
      Filter: matches the BAT naming rule and is not from this run (run_id) (for GenAI, the name in description)
    test_data: run_id of this run (resources of the same run are excluded)
    expected_results: No BAT resource left over from a previous run exists in any policy type.
BAT-BASIC-006:
  test_steps: |-
    1. 커넥터 실행 중인지 확인
    2. POST /sia/v1/web/policy(비활성 probe 정책)와 POST /sia/v1/user(probe 사용자)를 보냄
    3. SSE 차단 페이지(오류 코드든 2xx든 HTML)면 가로챔, API의 JSON 응답(오류 포함)이면 도달로 판정
    4. probe 정책과 사용자를 지우고 사라졌는지 다시 확인(실패하면 정리 경고)
  test_parameters: |-
    Connector process: AIConnector for Client (고정)
    Target API: POST /sia/v1/web/policy, POST /sia/v1/user
  test_data: |-
    POST /sia/v1/web/policy {name:"BAT-BASIC-006-probe-...", action_type:BLOCK, users:[0], rule: HTTP_HOST IS bat-probe.invalid}
    POST /sia/v1/user {login_id:"bat-bas-006-...@bat.local", role:"USER"}
  expected_results: 커넥터가 켜진 상태에서 관리 API 쓰기 요청이 SSE에 가로채이지 않고 API에 도달한다.
  en:
    scenario: Management API requests are not intercepted by SSE even while the connector is running.
    test_steps: |-
      1. Check that the connector is running
      2. Send POST /sia/v1/web/policy (disabled probe policy) and POST /sia/v1/user (probe user)
      3. If the response is an SSE block page (HTML, whether with an error code or 2xx), the verdict is intercepted; if it is a JSON response from the API (including errors), the verdict is reached
      4. Delete the probe policy and user and re-check that they are gone (if that fails, a cleanup warning)
    test_parameters: |-
      Connector process: AIConnector for Client (fixed)
      Target API: POST /sia/v1/web/policy, POST /sia/v1/user
    test_data: |-
      POST /sia/v1/web/policy {name:"BAT-BASIC-006-probe-...", action_type:BLOCK, users:[0], rule: HTTP_HOST IS bat-probe.invalid}
      POST /sia/v1/user {login_id:"bat-bas-006-...@bat.local", role:"USER"}
    expected_results: With the connector running, management API write requests are not intercepted by SSE and reach the API.
BAT-BASIC-007:
  test_steps: |-
    1. 콘솔 웹(console_url)에 GET
    2. REST(Open API) GET /sia/v1/user/group/list (토큰이 없으면 인증 없이 서버 응답만 확인)
    3. 콘솔 GraphQL에 가벼운 조회(캐시된 세션), 세션이 없으면 로그인
    4. 하나라도 연결 실패·타임아웃·HTTP 5xx면 서버 다운으로 FAIL, 401/403·설정 누락이면 BAT_ERROR
    5. 재확인 뒤에도 FAIL이면 나머지 케이스는 돌리지 않음
  test_parameters: |-
    실행 시점: 실행 처음(run_start), 다른 케이스보다 먼저
    대상: console_url, rest_base_url, graphql_url
  test_data: 'REST: GET /sia/v1/user/group/list?offset=1&limit=1, GraphQL: { SIA { common { browser_info { id } } } }'
  expected_results: 콘솔 웹·Open API·콘솔 GraphQL 서버가 모두 응답한다.
  actual_result: 콘솔·관리 API 서버가 응답하지 않음(서버 다운)
  en:
    scenario: The console web, Open API (REST) and console GraphQL servers answer (detects a server down).
    test_steps: |-
      1. GET the console web (console_url)
      2. REST (Open API) GET /sia/v1/user/group/list (without a token, only check that the server answers)
      3. A light query on the console GraphQL (cached session), or sign in when there is no session
      4. FAIL as a server down if any connection fails, times out or answers HTTP 5xx; BAT_ERROR for 401/403 or missing configuration
      5. If it is still FAIL after the re-check, the other cases are not run
    test_parameters: |-
      When: at the start of the run (run_start), before every other case
      Targets: console_url, rest_base_url, graphql_url
    test_data: 'REST: GET /sia/v1/user/group/list?offset=1&limit=1, GraphQL: { SIA { common { browser_info { id } } } }'
    expected_results: The console web, Open API and console GraphQL servers all answer.
    actual_result: The console / management API servers do not answer (server down)
BAT-BASIC-008:
  test_steps: |-
    1. 커넥터가 실행 중인지 확인(아니면 BAT_ERROR). curl이 요청을 보내지도 못하면(사용법 오류, 실행 파일 없음) 제품 응답이 없어 BAT_ERROR
    2. BAT 정책을 만들기 전에 ECHO_HOSTS 세 곳(https://<host>/get)에 curl 요청, 정상 응답이 올 때까지 최대 10초 재시도
    3. 막히면 차단 페이지가 밝힌 규칙 이름을 기록
    4. 전부 정상이면 PASS, 일부만 막히거나 닿지 않으면 WARN, 전부 막히거나 닿지 않으면 FAIL(다 막아버림)
    5. 전부 막혔는데 차단 페이지가 BAT가 아닌 정책 이름을 밝히면 그 사용자 정책 탓이라 UNVERIFIED
    6. 재확인 뒤에도 FAIL이면 나머지 케이스는 돌리지 않음
  test_parameters: |-
    실행 시점: 실행 처음(run_start), 서버 점검 다음
    대상: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
  test_data: 'URL: https://<host>/get?bat=baseline-start-<run_id>'
  expected_results: BAT 정책이 없는 상태에서 일반 대상 요청이 모두 정상 응답한다.
  actual_result: BAT 정책이 없는데도 일반 대상 요청이 막히거나 닿지 않음
  en:
    scenario: At the start of the run, with no BAT policy in place, requests to ordinary targets answer normally (detects everything being blocked).
    test_steps: |-
      1. Check that the connector is running (BAT_ERROR if not). If curl cannot even send the request (usage error, executable missing), there is no product answer, so BAT_ERROR
      2. Before creating any BAT policy, send curl requests to the three ECHO_HOSTS (https://<host>/get), retrying for up to 10 seconds until a normal answer comes back
      3. If blocked, record the rule name the block page gives
      4. PASS if all answer normally, WARN if only some are blocked or unreachable, FAIL if all are blocked or unreachable (everything blocked)
      5. UNVERIFIED if all are blocked but the block page names a policy that is not BAT's (that user policy is the cause)
      6. If it is still FAIL after the re-check, the other cases are not run
    test_parameters: |-
      When: at the start of the run (run_start), after the server check
      Targets: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
    test_data: 'URL: https://<host>/get?bat=baseline-start-<run_id>'
    expected_results: With no BAT policy in place, requests to ordinary targets all answer normally.
    actual_result: Requests to ordinary targets are blocked or unreachable even with no BAT policy
BAT-BASIC-009:
  test_steps: |-
    1. 커넥터가 실행 중인지 확인(아니면 BAT_ERROR). curl이 요청을 보내지도 못하면(사용법 오류, 실행 파일 없음) 제품 응답이 없어 BAT_ERROR
    2. 모든 케이스와 정책 정리가 끝난 뒤 ECHO_HOSTS 세 곳(https://<host>/get)에 curl 요청, 정상 응답이 올 때까지 정책 전파 시간(BAT_POLICY_TIMEOUT_SEC)+10초까지 재시도
    3. 막히면 차단 페이지가 밝힌 규칙 이름을 기록
    4. 전부 정상이면 PASS, 일부만 막히거나 닿지 않으면 WARN, 전부 막히거나 닿지 않으면 FAIL(정책 삭제 미반영)
    5. 전부 막혔는데 차단 페이지가 BAT가 아닌 정책 이름을 밝히면 그 사용자 정책 탓이라 UNVERIFIED
  test_parameters: |-
    실행 시점: 실행 마지막(run_end), 모든 케이스와 정리 뒤
    대상: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
  test_data: 'URL: https://<host>/get?bat=baseline-end-<run_id>'
  expected_results: 모든 BAT 정책을 지운 뒤에도 일반 대상 요청이 모두 정상 응답한다.
  actual_result: BAT 정책을 지운 뒤에도 일반 대상 요청이 막히거나 닿지 않음(정책 삭제 미반영)
  en:
    scenario: At the end of the run, after every BAT policy is deleted, requests to ordinary targets still answer normally (detects policy deletion not taking effect).
    test_steps: |-
      1. Check that the connector is running (BAT_ERROR if not). If curl cannot even send the request (usage error, executable missing), there is no product answer, so BAT_ERROR
      2. After every case and policy cleanup, send curl requests to the three ECHO_HOSTS (https://<host>/get), retrying until a normal answer comes back for up to the policy propagation time (BAT_POLICY_TIMEOUT_SEC) + 10 seconds
      3. If blocked, record the rule name the block page gives
      4. PASS if all answer normally, WARN if only some are blocked or unreachable, FAIL if all are blocked or unreachable (policy deletion not applied)
      5. UNVERIFIED if all are blocked but the block page names a policy that is not BAT's (that user policy is the cause)
    test_parameters: |-
      When: at the end of the run (run_end), after every case and cleanup
      Targets: ECHO_HOSTS (httpbin.org, postman-echo.com, httpbingo.org)
    test_data: 'URL: https://<host>/get?bat=baseline-end-<run_id>'
    expected_results: After every BAT policy is deleted, requests to ordinary targets all answer normally.
    actual_result: Requests to ordinary targets are still blocked or unreachable after the BAT policies were deleted (deletion not applied)
BAT-CASB-001:
  test_steps: |-
    1. 전체 앱 In-App Control LOGGING 정책 생성
    2. 목록을 다시 읽어 action_type(LOGGING)·risk_level(Minor)이 요청값과 같은지 비교(다르면 FAIL, 읽지 못하면 UNVERIFIED)
    3. 정책 삭제(목록에서 사라졌는지 다시 읽어 확인)
  test_parameters: |-
    product: casb
    lane: d
    policy_type: in_app_control
    action_type: LOGGING
    risk_level: Minor
    users: [0] (전체 사용자)
    user_groups: [0] (전체)
  test_data: |-
    정책명: BAT-CASB-001-<run_id>
