BAT-ZTNA-009:
  test_steps: |-
    1. 게이트웨이 서버 목록(콘솔 도메인이 있는 서버 먼저, 그 안에서 id 순)에서, 열리는 서버가 없으면 연결된 터널의 interface에서 규칙 없이 웹 포트(80/8080/8000/443/8443/3000/5000)가 처음 열리는 서버·포트와 그 페이지 <title>, 그 서버(또는 interface)에 콘솔이 붙인 도메인, 같은 포트로 열리는 다른 서버를 찾는다(스테이지 ztna·ztna_tunnel 설정에 적힌 값 우선, 못 찾으면 BAT_ERROR). 도메인이 없으면 BAT_ERROR
    2. 전체 사용자 LOGGING 접근정책을 만든다
    3. 찾은 도메인과 포트로 접근제어를 만들어 그 정책을 연결하고 우선순위를 0으로 올린다
    4. 커넥터 단말에서 <scheme>://<domain>:<port>/ 요청
    5. ZTNA 로그(service_security_log)에서 BAT 접근제어 이름의 AP_LOGGING 행 확인
    6. 접근제어, 접근정책 삭제
  test_parameters: |-
    접근제어: type HTTP, application [{domain, port, target_type: gateway 또는 tunnel, target_id: 게이트웨이 서버 id 또는 터널 interface id}], user/user_group [0], priority 0
    접근정책: action LOGGING, rules [{user_id: [0]}]
  test_data: 'lguplus: web.qa2.internal:80 → 192.168.3.106 (Retro Computing Archive)'
  expected_results: 페이지가 열리고(page_text 포함), ZTNA 로그에 BAT 접근제어·접근정책 이름, 목적지 <server_ip>:<port>, 이 단말 device_id의 AP_LOGGING 행이 남는다
  actual_result: 내부 서버 페이지가 열리지 않았거나, ZTNA 로그에 BAT 규칙 이름의 접속 기록이 없음
  en:
    scenario: With an access control registered by domain, the internal server page (behind a gateway or a tunnel) opens from the connector, and that access is recorded in the ZTNA log under the BAT rule name.
    test_steps: |-
      1. From the gateway server list (servers with a console domain first, then in id order), or from the interfaces of a connected tunnel when no gateway server opens, find the server and port where a web port (80/8080/8000/443/8443/3000/5000) first opens without any rule, that page's <title>, the domain the console attached to that server, and another server that opens on the same port (a value written in the stage ztna/ztna_tunnel setting takes priority; BAT_ERROR if not found). BAT_ERROR if there is no domain
      2. Create an all-users LOGGING access policy
      3. Create an access control with the found domain and port, attach that policy to it, and raise the priority to 0
      4. Request <scheme>://<domain>:<port>/ from the connector endpoint
      5. In the ZTNA log (service_security_log), confirm an AP_LOGGING row with the BAT access control name
      6. Delete the access control and the access policy
    test_parameters: |-
      access control: type HTTP, application [{domain, port, target_type: gateway or tunnel, target_id: gateway server id or tunnel interface id}], user/user_group [0], priority 0
      access policy: action LOGGING, rules [{user_id: [0]}]
    test_data: 'lguplus: web.qa2.internal:80 -> 192.168.3.106 (Retro Computing Archive)'
    expected_results: The page opens (including page_text), and the ZTNA log leaves an AP_LOGGING row with the BAT access control and access policy names, destination <server_ip>:<port>, and this endpoint's device_id
    actual_result: The internal server page did not open, or the ZTNA log has no access record under the BAT rule name
BAT-ZTNA-010:
  test_steps: |-
    1. 게이트웨이 서버 목록(콘솔 도메인이 있는 서버 먼저, 그 안에서 id 순)에서, 열리는 서버가 없으면 연결된 터널의 interface에서 규칙 없이 웹 포트(80/8080/8000/443/8443/3000/5000)가 처음 열리는 서버·포트와 그 페이지 <title>, 그 서버(또는 interface)에 콘솔이 붙인 도메인, 같은 포트로 열리는 다른 서버를 찾는다(스테이지 ztna·ztna_tunnel 설정에 적힌 값 우선, 못 찾으면 BAT_ERROR). 도메인이 없으면 BAT_ERROR
    1-1. 규칙 없이 <scheme>://<domain>:<port>/ 이 열리는지 확인(안 열리면 BAT_ERROR)
    2. 전체 사용자 BLOCK 접근정책을 만든다
    3. 도메인 접근제어를 만들어 그 정책을 연결하고 우선순위를 0으로 올린다
    4. 도메인과 서버 IP로 각각 요청해 "blocked by <접근제어 이름>" 차단 페이지 확인
    5. 같은 포트의 다른 내부 서버(찾았거나 설정된 other_ip)는 열리는지 확인
    6. ZTNA 로그에서 BAT 접근제어 이름의 AP_BLOCK 행 확인
    7. 접근제어, 접근정책 삭제 후 페이지가 다시 열리는지 확인
  test_parameters: |-
    접근제어: type HTTP, application [{domain, port, target_type: gateway 또는 tunnel, target_id}], priority 0
    접근정책: action BLOCK, rules [{user_id: [0]}]
  test_data: 'lguplus: web.qa2.internal / 192.168.3.106:80 차단 대상, 192.168.3.227:80 범위 확인'
  expected_results: 그 서버만 도메인·IP 모두 차단 페이지가 뜨고 다른 내부 서버는 열리며, AP_BLOCK 행이 남고, 삭제하면 다시 열린다
  actual_result: 도메인 접근제어의 BLOCK이 그 서버를 막지 않았거나, 다른 서버까지 막았거나, 삭제 후 다시 열리지 않음
  en:
    scenario: When a BLOCK access policy is attached to a domain access control, only that server (behind a gateway or a tunnel) is blocked, by both domain and IP, and it opens again once removed.
    test_steps: |-
      1. From the gateway server list (servers with a console domain first, then in id order), or from the interfaces of a connected tunnel when no gateway server opens, find the server and port where a web port (80/8080/8000/443/8443/3000/5000) first opens without any rule, that page's <title>, the domain the console attached to that server, and another server that opens on the same port (a value written in the stage ztna/ztna_tunnel setting takes priority; BAT_ERROR if not found). BAT_ERROR if there is no domain
      1-1. Confirm <scheme>://<domain>:<port>/ opens without a rule (BAT_ERROR if it does not open)
      2. Create an all-users BLOCK access policy
      3. Create a domain access control, attach that policy to it, and raise the priority to 0
      4. Request by domain and by server IP respectively and confirm the "blocked by <access control name>" block page
      5. Confirm the other internal server on the same port (the found or configured other_ip) opens
      6. In the ZTNA log, confirm an AP_BLOCK row with the BAT access control name
      7. After deleting the access control and the access policy, confirm the page opens again
    test_parameters: |-
      access control: type HTTP, application [{domain, port, target_type: gateway or tunnel, target_id}], priority 0
      access policy: action BLOCK, rules [{user_id: [0]}]
    test_data: 'lguplus: web.qa2.internal / 192.168.3.106:80 is the block target, 192.168.3.227:80 is checked for scope'
    expected_results: The block page appears for that server only, by both domain and IP, the other internal server opens, an AP_BLOCK row is left, and it opens again after deletion
    actual_result: The BLOCK of the domain access control did not block that server, or blocked other servers too, or it did not open again after deletion
BAT-ZTNA-011:
  test_steps: |-
    1. 게이트웨이 서버 목록(콘솔 도메인이 있는 서버 먼저, 그 안에서 id 순)에서, 열리는 서버가 없으면 연결된 터널의 interface에서 규칙 없이 웹 포트(80/8080/8000/443/8443/3000/5000)가 처음 열리는 서버·포트와 그 페이지 <title>, 그 서버(또는 interface)에 콘솔이 붙인 도메인, 같은 포트로 열리는 다른 서버를 찾는다(스테이지 ztna·ztna_tunnel 설정에 적힌 값 우선, 못 찾으면 BAT_ERROR)
