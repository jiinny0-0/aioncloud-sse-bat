BAT-SWG-016:
  test_steps: |-
    1. ANTI_VIRUS 시그니처 모듈 정책(BLOCK) 생성
    2. EICAR 테스트 문자열을 디스크에 쓰지 않고 PowerShell→curl stdin으로 직접 업로드(로컬 백신의 디스크 정화 우회)
    3. 업로드가 차단되는지 최대 20초 반복 확인
    4. 끝까지 차단되지 않으면 마지막 업로드의 httpbin 에코로 내용이 그대로 전달됐는지 확인(그대로 전달됐으면 FAIL, 응답이 없거나 에코가 다르면 UNVERIFIED)
    5. 보안로그 + 감사로그 확인, 정책 삭제
