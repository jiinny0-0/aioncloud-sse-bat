    접근제어: type HTTP, application [{ip, port, target_type: gateway 또는 tunnel, target_id}] (domain 없음), priority 0
    접근정책: action BLOCK, rules [{user_id: [0]}]
  test_data: 'lguplus: 192.168.3.106:80 차단 대상, 192.168.3.227:80 범위 확인'
  expected_results: 규칙에 적은 IP만 차단되고, 같은 포트의 다른 내부 서버는 열린다
  actual_result: IP만 넣은 접근제어가 IP를 보지 않고 포트만으로 매칭돼, 같은 포트의 다른 내부 서버(192.168.3.227:80)까지 그 규칙 이름으로 차단됨
  en:
    scenario: When BLOCK is attached to an access control registered by IP only, only that IP is blocked, and another internal server on the same port opens.
    test_steps: |-
      1. From the gateway server list (servers with a console domain first, then in id order), or from the interfaces of a connected tunnel when no gateway server opens, find the server and port where a web port (80/8080/8000/443/8443/3000/5000) first opens without any rule, that page's <title>, the domain the console attached to that server, and another server that opens on the same port (a value written in the stage ztna/ztna_tunnel setting takes priority; BAT_ERROR if not found). BAT_ERROR if there is no other server
      1-1. Confirm that other server (other_ip) opens without a rule (BAT_ERROR if it does not open)
      2. Create an all-users BLOCK access policy
      3. Create an access control with only the IP (server_ip:port), without a domain, attach it, and raise the priority to 0
      4. Confirm server_ip is blocked with "blocked by <access control name>"
      5. Confirm other_ip keeps opening
      6. Delete the access control and the access policy
    test_parameters: |-
      access control: type HTTP, application [{ip, port, target_type: gateway or tunnel, target_id}] (no domain), priority 0
      access policy: action BLOCK, rules [{user_id: [0]}]
    test_data: 'lguplus: 192.168.3.106:80 is the block target, 192.168.3.227:80 is checked for scope'
    expected_results: Only the IP written in the rule is blocked, and another internal server on the same port opens
    actual_result: The access control with only an IP does not look at the IP and matches by port alone, so another internal server on the same port (192.168.3.227:80) was also blocked under that rule name
BAT-ZTNA-013:
  test_steps: |-
    1. 게이트웨이 서버 목록(콘솔 도메인이 있는 서버 먼저, 그 안에서 id 순)에서, 열리는 서버가 없으면 연결된 터널의 interface에서 규칙 없이 웹 포트(80/8080/8000/443/8443/3000/5000)가 처음 열리는 서버·포트와 그 페이지 <title>, 그 서버(또는 interface)에 콘솔이 붙인 도메인, 같은 포트로 열리는 다른 서버를 찾는다(스테이지 ztna·ztna_tunnel 설정에 적힌 값 우선, 못 찾으면 BAT_ERROR)
    1-1. 그 서버(게이트웨이 서버 또는 터널 interface)에 콘솔이 등록한 도메인을 읽는다(없으면 BAT_ERROR)
    2. 단말에서 그 도메인을 조회해 커넥터가 server_ip로 답하는지 확인
    3. 전체 사용자 LOGGING 접근정책을 만든다
    4. 그 도메인으로 접근제어를 만들어 연결하고 우선순위를 0으로 올린다
    5. curl과 브라우저로 <scheme>://<도메인>:<port>/ 을 열어 내부 서버 페이지가 열리는지 확인
    6. ZTNA 로그에 BAT 접근제어 이름, AP_LOGGING, server_ip:port, 이 단말 device_id 행이 남는지 확인
    7. 접근제어, 접근정책 삭제
  test_parameters: |-
    게이트웨이 서버: SIA.ztna.gateway.list.servers {id, ip, domain}
    접근제어: type HTTP, application [{domain, port, target_type: gateway 또는 tunnel, target_id}], priority 0
    접근정책: action LOGGING, rules [{user_id: [0]}]
  test_data: 'lguplus: 게이트웨이 Openstack Test Env 서버 4 (192.168.3.106, 도메인 test.com), 페이지 문구 Retro Computing Archive'
  expected_results: 콘솔에 등록한 도메인이 커넥터에서 그 서버 IP로 풀리고, 브라우저와 curl 모두 내부 서버 페이지가 열리며, ZTNA 로그에 BAT 규칙 이름으로 접속이 남는다
  en:
    scenario: The domain registered on a gateway server (or tunnel interface) resolves to that IP on the connector so the page opens in the browser and with curl, and an access control made with that domain records the access.
    test_steps: |-
      1. From the gateway server list (servers with a console domain first, then in id order), or from the interfaces of a connected tunnel when no gateway server opens, find the server and port where a web port (80/8080/8000/443/8443/3000/5000) first opens without any rule, that page's <title>, the domain the console attached to that server, and another server that opens on the same port (a value written in the stage ztna/ztna_tunnel setting takes priority; BAT_ERROR if not found)
      1-1. Read the domain the console registered for that server (gateway server or tunnel interface) (BAT_ERROR if none)
      2. Look up that domain on the endpoint and confirm the connector answers with server_ip
      3. Create an all-users LOGGING access policy
      4. Create an access control with that domain, attach it, and raise the priority to 0
      5. Open <scheme>://<domain>:<port>/ with curl and the browser and confirm the internal server page opens
      6. Confirm the ZTNA log leaves a row with the BAT access control name, AP_LOGGING, server_ip:port, and this endpoint's device_id
      7. Delete the access control and the access policy
    test_parameters: |-
      gateway server: SIA.ztna.gateway.list.servers {id, ip, domain}
      access control: type HTTP, application [{domain, port, target_type: gateway or tunnel, target_id}], priority 0
      access policy: action LOGGING, rules [{user_id: [0]}]
    test_data: 'lguplus: gateway Openstack Test Env server 4 (192.168.3.106, domain test.com), page text Retro Computing Archive'
    expected_results: The domain registered in the console resolves to that server's IP on the connector, the internal server page opens in both the browser and curl, and the access is left in the ZTNA log under the BAT rule name
BAT-ZTNA-014:
  test_steps: |-
    1. 이번 실행 전용 도메인(bat-<run_id>.tunnel.internal)이 단말에서 안 풀리는지 확인(풀리면 BAT_ERROR)
    2. 그 도메인과 192.0.2.10으로 터널을 등록한다(커넥터 설치 안 함)
    3. 터널이 연결 안 됨(connect_status false)으로 보이고, 인증 파일이 이 워크스페이스용이며 access_id가 있는지 확인
    4. 단말에서 그 도메인이 192.0.2.10으로 풀리는지 확인(커넥터 설정 반영)
    5. 192.0.2.10으로 접속되지 않는지 확인
    6. 터널 삭제 후 그 도메인이 더 이상 풀리지 않는지 확인
  test_parameters: |-
    터널: create(name, description, interface [{ip: 192.0.2.10, domain}]), delete(id: [id])
    인증 파일: tunnel.authFile(id).file_content (base64 JSON: workspace, access_id, client_type, vpn_type, pqc), 값은 기록하지 않음
  test_data: 'lguplus: 192.0.2.10(문서용 대역), bat-<run_id>.tunnel.internal'
  expected_results: 등록한 터널의 도메인이 바로 커넥터에 내려가 단말에서 터널 주소로 풀리지만 연결 안 된 터널로는 접속되지 않고, 터널을 지우면 그 이름이 사라진다
  en:
    scenario: When a tunnel without an installed connector is registered, its domain resolves to the tunnel address on the endpoint but the connection does not succeed, and the name disappears once it is deleted.
    test_steps: |-
      1. Confirm the domain dedicated to this run (bat-<run_id>.tunnel.internal) does not resolve on the endpoint (BAT_ERROR if it resolves)
      2. Register a tunnel with that domain and 192.0.2.10 (no connector installed)
      3. Confirm the tunnel shows as not connected (connect_status false), and that the auth file is for this workspace and has an access_id
      4. Confirm that domain resolves to 192.0.2.10 on the endpoint (connector settings applied)
      5. Confirm the connection to 192.0.2.10 does not succeed
      6. After deleting the tunnel, confirm that domain no longer resolves
    test_parameters: |-
      tunnel: create(name, description, interface [{ip: 192.0.2.10, domain}]), delete(id: [id])
      auth file: tunnel.authFile(id).file_content (base64 JSON: workspace, access_id, client_type, vpn_type, pqc), the value is not recorded
    test_data: 'lguplus: 192.0.2.10 (documentation range), bat-<run_id>.tunnel.internal'
    expected_results: The domain of the registered tunnel is pushed to the connector immediately and resolves to the tunnel address on the endpoint, but the unconnected tunnel cannot be reached, and when the tunnel is deleted that name disappears
