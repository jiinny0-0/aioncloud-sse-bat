      1. From the gateway server list (servers with a console domain first, then in id order), or from the interfaces of a connected tunnel when no gateway server opens, find the server and port where a web port (80/8080/8000/443/8443/3000/5000) first opens without any rule, that page's <title>, the domain the console attached to that server, and another server that opens on the same port (a value written in the stage ztna/ztna_tunnel setting takes priority; BAT_ERROR if not found)
      1-1. Create an all-users LOGGING access policy
