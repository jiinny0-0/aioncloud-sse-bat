BAT-SWG-014:
  test_steps: |-
    대상 호스트(httpbin.org, postman-echo.com, httpbingo.org)마다 아래를 반복한다.
    1. HTTP_URL 조건(IS, https://<호스트>/get 전체 URL)으로 BLOCK 웹 정책을 생성한다
    2. 브라우저로 그 URL을 차단될 때까지 재시도 방문해 차단됨을 확인한다
    3. 같은 호스트의 다른 경로(https://<호스트>/headers)를 방문해 정상 로드되는지 확인한다
    4. 보안 로그에서 정책명이 일치하는 이벤트를 대기한다
    5. audit_log에서 정책명을 포함하는 생성 기록을 확인한다
    6. 정책을 삭제한다
    7. 대상별 결과가 모두 기대대로면 PASS, 하나라도 어긋나면 FAIL, 어긋남 없이 확인 못 한 대상만 있으면 UNVERIFIED
  test_parameters: |-
    subject: HTTP_URL
    condition: IS
    action_type: BLOCK
    risk_level: MAJOR
    value: 스킴 포함 전체 URL
  test_data: 대상 호스트(ECHO_HOSTS)=httpbin.org, postman-echo.com, httpbingo.org. 차단 대상 "https://<호스트>/get", 허용돼야 하는 같은 호스트의 다른 경로 "https://<호스트>/headers"
  expected_results: HTTP_URL 조건으로 정확한 URL 하나만 지정한 BLOCK 정책은 그 URL만 차단하고 같은 호스트의 다른 경로는 통과시켜야 하며, 보안 로그와 감사 로그 양쪽에 생성 기록이 남아야 한다.
BAT-SWG-015:
