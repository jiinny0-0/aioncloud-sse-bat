BAT-ZTNA-013:
  test_steps: |-
    1. 게이트웨이 서버 목록에서 ztna.server_ip 서버에 콘솔이 등록한 도메인을 읽는다(없으면 ERROR)
    2. 단말에서 그 도메인을 조회해 커넥터가 server_ip로 답하는지 확인
    3. 전체 사용자 LOGGING 접근정책을 만든다
    4. 그 도메인으로 접근제어를 만들어 연결하고 우선순위를 0으로 올린다
    5. curl과 브라우저로 http://<도메인>/ 을 열어 내부 서버 페이지가 열리는지 확인
    6. ZTNA 로그에 BAT 접근제어 이름, AP_LOGGING, server_ip:port, 이 단말 device_id 행이 남는지 확인
    7. 접근제어, 접근정책 삭제
